name: Modernization validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: backend
      TERMINAL_PASSWORD: ci-only-password-at-least-16-chars
      COOKIE_SECURE: 'false'
      FYERS_CLIENT_ID: ''
      FYERS_SECRET_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.lock -r backend/requirements-test.txt
      - run: python -m compileall -q backend/app bot
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: find backend/app/static/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: python scripts/benchmark.py > benchmark.json
      - run: python -m pip_audit --no-deps --disable-pip -r backend/requirements.lock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            test-results.xml
            benchmark.json
