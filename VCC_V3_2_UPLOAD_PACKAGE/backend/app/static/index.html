            </div>
          );
        }
        return this.props.children;
      }
    }

    // ── INTRADAY REAL-TIME OI TIMELINE GRAPH COMPONENT (09:15 - 15:45 IST) ──
    function OITimelineGraph({ timeline, symbol }) {
      const [graphMode, setGraphMode] = useState('total'); // 'total' or 'change'

      const pts = useMemo(() => {
        if (!timeline || !Array.isArray(timeline) || timeline.length === 0) {
          const times = ["09:15", "09:30", "09:45", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:45"];
          return times.map((t, idx) => {
            const factor = (idx + 1) / times.length;
            return {
              time: t,
              ce_oi: Math.round(12500000 * (0.82 + 0.18 * factor)),
              pe_oi: Math.round(15200000 * (0.78 + 0.22 * factor)),
              ce_oi_chg: Math.round(340000 * factor),
              pe_oi_chg: Math.round(820000 * factor),
              spot: Math.round(24520.5 * (1 + (factor - 0.5) * 0.003) * 100) / 100
            };
          });
        }
        if (timeline.length > 80) {
          const step = Math.ceil(timeline.length / 60);
          const sampled = [];
          for (let i = 0; i < timeline.length; i += step) {
            sampled.push(timeline[i]);
          }
          if (sampled[sampled.length - 1] !== timeline[timeline.length - 1]) {
            sampled.push(timeline[timeline.length - 1]);
          }
          return sampled;
        }
        return timeline;
      }, [timeline]);



      const { maxOI, minOI, maxChg, minChg } = useMemo(() => {
        if (!pts.length) return { maxOI: 100, minOI: 0, maxChg: 100, minChg: 0 };
        let maxO = 0, minO = Infinity, maxC = -Infinity, minC = Infinity;
        pts.forEach(p => {
          if (p.ce_oi > maxO) maxO = p.ce_oi;
          if (p.pe_oi > maxO) maxO = p.pe_oi;
          if (p.ce_oi < minO) minO = p.ce_oi;
          if (p.pe_oi < minO) minO = p.pe_oi;

          if (p.ce_oi_chg > maxC) maxC = p.ce_oi_chg;
          if (p.pe_oi_chg > maxC) maxC = p.pe_oi_chg;
          if (p.ce_oi_chg < minC) minC = p.ce_oi_chg;
          if (p.pe_oi_chg < minC) minC = p.pe_oi_chg;
        });
        return {
          maxOI: maxO * 1.05,
          minOI: Math.max(0, minO * 0.95),
          maxChg: Math.max(1, maxC * 1.1),
          minChg: Math.min(-1, minC * 1.1)
        };
      }, [pts]);

      const width = 600;
      const height = 170;
      const padding = 20;

      const cePoints = useMemo(() => {
        if (!pts.length) return '';
        return pts.map((p, i) => {
          const x = padding + (i / Math.max(1, pts.length - 1)) * (width - 2 * padding);
          const val = graphMode === 'total' ? p.ce_oi : p.ce_oi_chg;
          const minV = graphMode === 'total' ? minOI : minChg;
          const maxV = graphMode === 'total' ? maxOI : maxChg;
          const y = height - padding - ((val - minV) / Math.max(1, maxV - minV)) * (height - 2 * padding);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
      }, [pts, graphMode, maxOI, minOI, maxChg, minChg]);

      const pePoints = useMemo(() => {
        if (!pts.length) return '';
        return pts.map((p, i) => {
          const x = padding + (i / Math.max(1, pts.length - 1)) * (width - 2 * padding);
          const val = graphMode === 'total' ? p.pe_oi : p.pe_oi_chg;
          const minV = graphMode === 'total' ? minOI : minChg;
          const maxV = graphMode === 'total' ? maxOI : maxChg;
          const y = height - padding - ((val - minV) / Math.max(1, maxV - minV)) * (height - 2 * padding);
          return `${x.toFixed(1)},${y.toFixed(1)}`;
        }).join(' ');
      }, [pts, graphMode, maxOI, minOI, maxChg, minChg]);

      const lastPoint = pts.length ? pts[pts.length - 1] : null;

      return (
        <div className="bg-bg p-3 rounded border border-cardBorder space-y-2 font-mono shadow">
          <div className="flex flex-wrap items-center justify-between gap-2 border-b border-cardBorder pb-2">
            <div className="flex items-center space-x-2">
              <span className="text-slate-200 font-bold text-xs">
                📈 REAL-TIME INTRADAY OI TIMELINE (09:15 - 15:45 IST)
              </span>
              <span className="px-1.5 py-0.5 bg-emerald-950 text-bull text-[9px] rounded border border-emerald-800 font-bold animate-pulse">
                LIVE TREND
              </span>
            </div>

            {/* Mode Selector */}
            <div className="flex items-center space-x-1 bg-card p-1 rounded border border-cardBorder text-[9.5px]">
              <button
                onClick={() => setGraphMode('total')}
                className={`px-2 py-0.5 rounded transition font-bold cursor-pointer ${
                  graphMode === 'total' ? 'bg-bloombergOrange text-black shadow' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                TOTAL CE vs PE OI
              </button>
              <button
                onClick={() => setGraphMode('change')}
                className={`px-2 py-0.5 rounded transition font-bold cursor-pointer ${
                  graphMode === 'change' ? 'bg-bloombergOrange text-black shadow' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                CHANGE IN OI
              </button>
            </div>
          </div>

          {/* SVG Line Graph */}
          <div className="relative w-full overflow-hidden bg-slate-950/90 rounded border border-cardBorder p-1">
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-40 overflow-visible">
              {/* Horizontal Grid lines */}
              <line x1={padding} y1={height/4} x2={width-padding} y2={height/4} stroke="#1e2638" strokeDasharray="3,3" />
              <line x1={padding} y1={height/2} x2={width-padding} y2={height/2} stroke="#1e2638" strokeDasharray="3,3" />
              <line x1={padding} y1={(3*height)/4} x2={width-padding} y2={(3*height)/4} stroke="#1e2638" strokeDasharray="3,3" />

              {/* Call OI Line (Red) */}
              <polyline
                fill="none"
                stroke="#ef4444"
                strokeWidth="2.5"
                strokeLinecap="round"
                strokeLinejoin="round"
                points={cePoints}
              />

              {/* Put OI Line (Green) */}
              <polyline
                fill="none"
                stroke="#10b981"
                strokeWidth="2.5"
                strokeLinecap="round"
                strokeLinejoin="round"
                points={pePoints}
              />

              {/* Interactive Dots for Data Points */}
              {pts.map((p, i) => {
                const x = padding + (i / Math.max(1, pts.length - 1)) * (width - 2 * padding);
                const ceVal = graphMode === 'total' ? p.ce_oi : p.ce_oi_chg;
                const peVal = graphMode === 'total' ? p.pe_oi : p.pe_oi_chg;
                const minV = graphMode === 'total' ? minOI : minChg;
                const maxV = graphMode === 'total' ? maxOI : maxChg;
                const ceY = height - padding - ((ceVal - minV) / Math.max(1, maxV - minV)) * (height - 2 * padding);
                const peY = height - padding - ((peVal - minV) / Math.max(1, maxV - minV)) * (height - 2 * padding);

                return (
                  <g key={i}>
                    <circle cx={x} cy={ceY} r="3" fill="#ef4444" />
                    <circle cx={x} cy={peY} r="3" fill="#10b981" />
                  </g>
                );
              })}
            </svg>

            {/* Timeline X-Axis Time Labels */}
            <div className="flex justify-between text-[8.5px] text-slate-400 font-mono px-2 pt-1 border-t border-cardBorder/40">
              <span>09:15</span>
              <span>10:30</span>
              <span>12:00</span>
              <span>13:30</span>
              <span>15:00</span>
              <span>15:45 IST</span>
            </div>
          </div>

          {/* Current Live Stats Footer */}
          <div className="flex items-center justify-between text-[10px] bg-card p-2 rounded border border-cardBorder">
            <div className="flex items-center space-x-1.5">
              <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
              <span className="text-emerald-400 font-bold">PUT OI: {formatOI(lastPoint?.pe_oi)} ({lastPoint?.pe_oi_chg >= 0 ? '+' : ''}{formatOI(lastPoint?.pe_oi_chg)})</span>
            </div>
            <div className="flex items-center space-x-1.5">
              <span className="w-2 h-2 rounded-full bg-rose-500"></span>
              <span className="text-rose-400 font-bold">CALL OI: {formatOI(lastPoint?.ce_oi)} ({lastPoint?.ce_oi_chg >= 0 ? '+' : ''}{formatOI(lastPoint?.ce_oi_chg)})</span>
            </div>
            <div className="text-amber-300 font-bold">
              SPOT: ₹{formatNumber(lastPoint?.spot || 24520)}
            </div>
          </div>
        </div>
      );
    }

    // Reusable Dual-Axis SVG Line Chart for Intraday OI Trends
    function SingleDualAxisChart({ title, dataPoints, mode, legendLabels }) {
      // Downsample large datasets to max ~80 points for chart rendering performance
      let pts = dataPoints && dataPoints.length ? dataPoints : [];
      if (pts.length > 80) {
        const step = Math.ceil(pts.length / 60);
        const sampled = [];
        for (let i = 0; i < pts.length; i += step) {
          sampled.push(pts[i]);
        }
        if (sampled[sampled.length - 1] !== pts[pts.length - 1]) {
          sampled.push(pts[pts.length - 1]);
        }
        pts = sampled;
      }

      // Timestamps are already in IST from backend — no conversion needed
      const formatISTTime = (timeStr) => {
        if (!timeStr) return '';
        return timeStr;
      };
      
      const width = 600;
      const height = 180;
      const padding = 45;

      const spotValues = pts.map(p => p.spot || 0).filter(v => v > 0);
      const minSpot = spotValues.length ? Math.min(...spotValues) : 24000;
      const maxSpot = spotValues.length ? Math.max(...spotValues) : 25000;

      let line1Values = [];
      let line2Values = [];

      if (mode === 'total') {
        line1Values = pts.map(p => p.ce_oi || 0);
        line2Values = pts.map(p => p.pe_oi || 0);
      } else if (mode === 'change') {
        line1Values = pts.map(p => p.ce_oi_chg || 0);
        line2Values = pts.map(p => p.pe_oi_chg || 0);
      } else if (mode === 'diff') {
        line1Values = pts.map(p => (p.ce_oi || 0) - (p.pe_oi || 0));
      }

      const allOiValues = [...line1Values, ...line2Values].filter(v => v !== undefined);
      const minOi = allOiValues.length ? Math.min(...allOiValues) : 0;
      const maxOi = allOiValues.length ? Math.max(...allOiValues) : 100;

      // Calculate path points
      const spotPoints = pts.map((p, i) => {
        const x = padding + (i / Math.max(1, pts.length - 1)) * (width - 2 * padding);
        const y = height - padding - ((p.spot - minSpot) / Math.max(1, maxSpot - minSpot)) * (height - 2 * padding);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const line1Points = pts.map((p, i) => {
        const x = padding + (i / Math.max(1, pts.length - 1)) * (width - 2 * padding);
        const val = line1Values[i] || 0;
        const y = height - padding - ((val - minOi) / Math.max(1, maxOi - minOi)) * (height - 2 * padding);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const line2Points = mode !== 'diff' ? pts.map((p, i) => {
        const x = padding + (i / Math.max(1, pts.length - 1)) * (width - 2 * padding);
        const val = line2Values[i] || 0;
        const y = height - padding - ((val - minOi) / Math.max(1, maxOi - minOi)) * (height - 2 * padding);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ') : '';

      return (
        <div className="bg-slate-950/90 rounded-xl border border-cardBorder p-3 space-y-2 font-mono shadow-lg relative">
          <div className="flex items-center justify-between border-b border-slate-800/80 pb-2">
            <div className="flex items-center space-x-2">
              <span className="font-bold text-slate-200 text-xs tracking-wider uppercase">{title}</span>
              <span className="text-[9px] text-amber-400 font-bold bg-amber-950/70 border border-amber-800/80 px-1.5 py-0.5 rounded">
                ATM ± 10 STRIKES
              </span>
            </div>
            <div className="flex items-center space-x-3 text-[10px]">
              {legendLabels.line1 && (
                <span className="flex items-center space-x-1">
                  <span className="w-2 h-2 rounded-full bg-[#00f0ff]"></span>
                  <span className="text-[#00f0ff] font-bold">{legendLabels.line1}</span>
                </span>
              )}
              {legendLabels.line2 && (
                <span className="flex items-center space-x-1">
                  <span className="w-2 h-2 rounded-full bg-[#ff2a5f]"></span>
                  <span className="text-[#ff2a5f] font-bold">{legendLabels.line2}</span>
                </span>
              )}
              <span className="flex items-center space-x-1">
                <span className="w-2 h-0.5 bg-white border-b border-dashed border-white"></span>
                <span className="text-slate-300 font-bold">Price</span>
              </span>
            </div>
          </div>

          <div className="relative w-full">
            <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-44 overflow-visible">
              {/* Left Y Axis Labels (Price) */}
              <text x={padding - 5} y={padding + 5} textAnchor="end" fill="#94a3b8" fontSize="8" className="font-mono">{maxSpot.toFixed(0)}</text>
              <text x={padding - 5} y={height - padding} textAnchor="end" fill="#94a3b8" fontSize="8" className="font-mono">{minSpot.toFixed(0)}</text>

              {/* Right Y Axis Labels (OI) */}
              <text x={width - padding + 5} y={padding + 5} textAnchor="start" fill="#00f0ff" fontSize="8" className="font-mono">{formatOI(maxOi)}</text>
              <text x={width - padding + 5} y={height - padding} textAnchor="start" fill="#00f0ff" fontSize="8" className="font-mono">{formatOI(minOi)}</text>

              {/* Grid Lines */}
              <line x1={padding} y1={padding} x2={width - padding} y2={padding} stroke="#1e293b" strokeDasharray="2,2" />
              <line x1={padding} y1={height / 2} x2={width - padding} y2={height / 2} stroke="#1e293b" strokeDasharray="2,2" />
              <line x1={padding} y1={height - padding} x2={width - padding} y2={height - padding} stroke="#1e293b" strokeDasharray="2,2" />

              {/* Dotted White Price Line */}
              <polyline fill="none" stroke="#ffffff" strokeWidth="1.8" strokeDasharray="3,3" opacity="0.8" points={spotPoints} />

              {/* Cyan CE Line */}
              <polyline fill="none" stroke="#00f0ff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" points={line1Points} />

              {/* Crimson PE Line (if not diff) */}
              {mode !== 'diff' && (
                <polyline fill="none" stroke="#ff2a5f" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" points={line2Points} />
              )}
            </svg>

            {/* X-Axis Time Markers */}
            <div className="flex justify-between text-[9px] text-slate-400 px-8 pt-1 border-t border-slate-800/80">
              {pts.length > 0 ? (
                <>
                  <span>{formatISTTime(pts[0]?.time) || '09:15'}</span>
                  <span>{formatISTTime(pts[Math.floor(pts.length * 0.25)]?.time) || '10:48'}</span>
                  <span>{formatISTTime(pts[Math.floor(pts.length * 0.5)]?.time) || '12:21'}</span>
                  <span>{formatISTTime(pts[Math.floor(pts.length * 0.75)]?.time) || '13:54'}</span>
                  <span>{formatISTTime(pts[pts.length - 1]?.time) || '15:30'}</span>
                </>
              ) : (
                <span>09:15 IST - 15:30 IST</span>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Helper function for Derivatives Buildup Classification & Color Coding
    const getBuildupDetails = (interpStr, oiChg, ltpChg) => {
      const raw = (interpStr || '').toLowerCase();
      if (raw.includes('fresh long') || raw.includes('long buildup') || (oiChg > 0 && ltpChg >= 0)) {
        return {
          type: 'LONG_BUILDUP',
          label: 'LONG BUILDUP',
          short: 'LB',
          bg: 'bg-emerald-950/90 text-emerald-300 border-emerald-700',
          badge: 'bg-emerald-500 text-black font-bold',
          text: 'text-emerald-400',
          dot: '🟢',
          desc: 'Price ↑ & OI ↑ (Bullish Buying)'
        };
      } else if (raw.includes('fresh short') || raw.includes('short buildup') || (oiChg > 0 && ltpChg < 0)) {
        return {
          type: 'SHORT_BUILDUP',
          label: 'SHORT BUILDUP',
          short: 'SB',
          bg: 'bg-rose-950/90 text-rose-300 border-rose-700',
          badge: 'bg-rose-600 text-white font-bold',
          text: 'text-rose-400',
          dot: '🔴',
          desc: 'Price ↓ & OI ↑ (Bearish Shorting / Writing)'
        };
      } else if (raw.includes('covering') || (oiChg < 0 && ltpChg >= 0)) {
        return {
          type: 'SHORT_COVERING',
          label: 'SHORT COVERING',
          short: 'SC',
          bg: 'bg-amber-950/90 text-amber-300 border-amber-700',
          badge: 'bg-amber-400 text-black font-bold',
          text: 'text-amber-400',
          dot: '🟡',
          desc: 'Price ↑ & OI ↓ (Shorts Exiting / Relief Up)'
        };
      } else if (raw.includes('unwinding') || (oiChg < 0 && ltpChg < 0)) {
        return {
          type: 'LONG_UNWINDING',
          label: 'LONG UNWINDING',
          short: 'LU',
          bg: 'bg-sky-950/90 text-sky-300 border-sky-700',
          badge: 'bg-sky-500 text-black font-bold',
          text: 'text-sky-400',
          dot: '🔵',
          desc: 'Price ↓ & OI ↓ (Longs Exiting / Profit Booking)'
        };
      }
      return {
        type: 'NEUTRAL',
        label: 'NEUTRAL',
        short: 'NT',
        bg: 'bg-slate-900 text-slate-400 border-slate-700',
        badge: 'bg-slate-700 text-slate-300 font-bold',
        text: 'text-slate-400',
        dot: '⚪',
        desc: 'No Major Shift'
      };
    };

    // ── STEP 6: SIGNAL DECISION PANEL ──
    function SignalDecisionPanel({ data, activeSymbol, activeStock }) {
      const signal = data?.signal_card || data?.active_signal || {};
      const direction = (signal.direction || 'NEUTRAL').toUpperCase();
      const opState = (signal.operational_state || 'NO SIGNAL').toUpperCase();
      const regime = (signal.market_regime || 'RANGE').toUpperCase();
      const confidence = signal.confidence ?? 50;
      const confluenceScore = signal.confluence_score ?? 50;
      const evidences = signal.evidences || [];
      const conflicts = signal.conflicts || [];
      const reasonCodes = signal.reason_codes || [];

      const marketState = data?.market_state || {};
      const isMarketOpen = marketState.is_market_open ?? true;
      const session = marketState.session || 'LIVE MARKET';
      const isClosed = !isMarketOpen || session === 'MARKET CLOSED';

      const health = data?.system_health || {};
      const quality = (health.data_quality || data?.data_source || 'GOOD').toUpperCase();
      const isStale = quality.includes('INVALID') || quality.includes('SIMULATED') || quality.includes('MOCK');
      const dataAge = health.spot_data_age_sec || data?.option_chain?.spot_data_age_sec || 0;

      // Filter evidence
      const supportingEvidences = evidences.filter(e => e.is_supportive !== false);
      const conflictingEvidences = evidences.filter(e => e.is_supportive === false);

      // Color maps for Direction & State
      let dirColor = {
        bg: 'bg-slate-900',
        border: 'border-slate-700',
        text: 'text-slate-200',
        badge: 'bg-slate-800 text-slate-300',
        icon: '⚪'
      };

      if (isClosed) {
        dirColor = {
          bg: 'bg-slate-950/90',
          border: 'border-slate-800',
          text: 'text-slate-400',
          badge: 'bg-slate-900 text-slate-400 border border-slate-700',
          icon: '🌙'
        };
      } else if (opState === 'SIGNAL CONFLICT' || regime.includes('CONFLICT')) {
        dirColor = {
          bg: 'bg-purple-950/80',
          border: 'border-purple-600',
          text: 'text-purple-300',
          badge: 'bg-purple-900 text-purple-200 border border-purple-500 animate-pulse',
          icon: '⚡'
        };
      } else if (direction.includes('BULL')) {
        dirColor = {
          bg: 'bg-emerald-950/80',
          border: 'border-emerald-700',
          text: 'text-emerald-300',
          badge: 'bg-emerald-900 text-bull border border-emerald-600',
          icon: '🟢'
        };
      } else if (direction.includes('BEAR')) {
        dirColor = {
          bg: 'bg-rose-950/80',
          border: 'border-rose-700',
          text: 'text-rose-300',
          badge: 'bg-rose-900 text-bear border border-rose-600',
          icon: '🔴'
        };
      } else if (opState.includes('WATCH')) {
        dirColor = {
          bg: 'bg-sky-950/80',
          border: 'border-sky-700',
          text: 'text-sky-300',
          badge: 'bg-sky-900 text-sky-200 border border-sky-600',
          icon: '🔵'
        };
      }

      // Format Timestamp & Signal Age
      const rawTimestamp = signal.timestamp || data?.timestamp || '';
      const formattedTime = rawTimestamp.includes('T')
        ? new Date(rawTimestamp).toLocaleTimeString('en-IN', { hour12: false }) + ' IST'
        : (rawTimestamp || 'LIVE');

      return (
        <div className={`rounded-xl border p-4 font-mono shadow-xl space-y-4 ${dirColor.bg} ${dirColor.border}`}>
          {/* Header & Status Bar */}
          <div className="flex items-center justify-between border-b border-cardBorder/60 pb-2.5">
            <div className="flex items-center space-x-2">
              <span className="text-base font-extrabold text-slate-100 tracking-wide uppercase">
                🎯 SIGNAL DECISION
              </span>
              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-900 text-amber-400 border border-amber-800/60">
                {activeSymbol || 'NIFTY'}
              </span>
              {(() => {
                const stockSym = typeof activeStock === 'string' ? activeStock : activeStock?.symbol;
                return stockSym && stockSym !== activeSymbol ? (
                  <span className="px-2 py-0.5 rounded text-[9.5px] font-medium bg-slate-900/80 text-slate-400 border border-slate-800">
                    CONTEXT: {stockSym}
                  </span>
                ) : null;
              })()}
            </div>

            {/* Data Quality & Freshness Badge */}
            <div className="flex items-center space-x-2 text-[10px]">
              <span className={`px-2 py-0.5 rounded font-bold border ${
                isStale ? 'bg-rose-950 text-rose-300 border-rose-800' : 'bg-emerald-950 text-emerald-300 border-emerald-800'
              }`}>
                {isStale ? '⚠️ STALE / SIMULATED' : '🟢 LIVE DATA'}
              </span>
              <span className="text-slate-400 text-[9px]">
                {dataAge > 0 ? `${dataAge.toFixed(1)}s ago` : formattedTime}
              </span>
            </div>
          </div>

          {/* Primary Signal Direction & Operational State Display */}
          <div className="bg-bg/80 rounded-lg p-3 border border-cardBorder space-y-2">
            <div className="flex items-center justify-between">
              <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">
                AUTHORITATIVE VCC DIRECTION
              </div>
              <span className="text-[10px] text-slate-400">REGIME: <strong className="text-slate-200">{regime}</strong></span>
            </div>

            <div className="flex items-center justify-between flex-wrap gap-2">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">{dirColor.icon}</span>
                <div>
                  <div className={`text-xl font-black tracking-wider uppercase ${dirColor.text}`}>
                    {direction}
                  </div>
                  <div className="text-[10px] text-slate-400 font-bold">
                    OPERATIONAL STATE: <span className="text-amber-300 uppercase">{opState}</span>
                  </div>
                </div>
              </div>

              {/* Operational State Pill */}
              <div className="text-right">
                <span className={`px-3 py-1.5 rounded-md text-xs font-black uppercase tracking-wider shadow-inner ${dirColor.badge}`}>
                  {isClosed ? 'MARKET CLOSED' : opState}
                </span>
                {isClosed && (
                  <div className="text-[9px] text-slate-400 mt-1">
                    Last Session State (Non-executable)
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Confidence vs Confluence Visual Meters */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-[11px]">
            {/* Model Confidence */}
            <div className="bg-bg/70 p-2.5 rounded-lg border border-cardBorder space-y-1.5">
              <div className="flex justify-between items-center text-[10px] text-slate-400 font-bold">
                <span>MODEL CONFIDENCE</span>
                <span className="text-amber-400 font-extrabold text-xs">{confidence.toFixed(0)}%</span>
              </div>
              <div className="w-full bg-slate-900 h-2.5 rounded overflow-hidden border border-cardBorder relative">
                <div 
                  className="bg-gradient-to-r from-amber-500 to-emerald-400 h-full transition-all duration-500 rounded"
                  style={{ width: `${Math.min(100, Math.max(0, confidence))}%` }}
                ></div>
              </div>
              <div className="text-[9px] text-slate-500 flex justify-between">
                <span>Analytical Certainty</span>
                <span>(Not Win Probability)</span>
              </div>
            </div>

            {/* Confluence Score */}
            <div className="bg-bg/70 p-2.5 rounded-lg border border-cardBorder space-y-1.5">
              <div className="flex justify-between items-center text-[10px] text-slate-400 font-bold">
                <span>CONFLUENCE SCORE</span>
                <span className="text-bloombergOrange font-extrabold text-xs">{confluenceScore.toFixed(0)} / 100</span>
              </div>
              <div className="w-full bg-slate-900 h-2.5 rounded overflow-hidden border border-cardBorder relative">
                <div 
                  className="bg-gradient-to-r from-sky-500 via-amber-400 to-bloombergOrange h-full transition-all duration-500 rounded"
                  style={{ width: `${Math.min(100, Math.max(0, confluenceScore))}%` }}
                ></div>
              </div>
              <div className="text-[9px] text-slate-400 flex justify-between font-mono">
                <span className="text-emerald-400">✓ {supportingEvidences.length} Evidence</span>
                <span className="text-rose-400">⚠ {conflicts.length + conflictingEvidences.length} Conflict</span>
              </div>
            </div>
          </div>

          {/* Evidence Rationale ("WHY") Section */}
          <div className="bg-bg/60 rounded-lg p-3 border border-cardBorder space-y-2">
            <div className="flex items-center justify-between text-[10.5px] font-bold border-b border-cardBorder/50 pb-1.5">
              <span className="text-emerald-400 uppercase tracking-wider flex items-center space-x-1.5">
                <span>✓ SUPPORTING EVIDENCE ({supportingEvidences.length})</span>
              </span>
              <span className="text-[9.5px] text-slate-400 font-normal">Backend Derived</span>
            </div>

            {data?.answers?.why && (
              <div className="text-[10.5px] bg-slate-900/80 p-2 rounded border border-slate-800 text-slate-300 italic">
                "{data.answers.why}"
              </div>
            )}

            <div className="space-y-1.5 max-h-36 overflow-y-auto pr-1">
              {supportingEvidences.length > 0 ? (
                supportingEvidences.map((ev, i) => (
                  <div key={i} className="flex items-start justify-between text-[10px] bg-slate-900/50 p-1.5 rounded border border-slate-800/80">
                    <div className="flex items-center space-x-1.5">
                      <span className="text-emerald-400">✓</span>
                      <span className="font-bold text-slate-200">{ev.factor_name || ev.evidence_type}</span>
                      {ev.value_str && <span className="text-amber-300 font-semibold">({ev.value_str})</span>}
                    </div>
                    <span className="text-[9.5px] text-slate-400 max-w-[200px] truncate text-right">
                      {ev.explanation || ev.description || 'Confirmed'}
                    </span>
                  </div>
                ))
              ) : (
                <div className="text-[10px] text-slate-500 italic p-1">
                  RATIONALE: AVAILABLE IN BACKEND SIGNAL DETAILS
                </div>
              )}
            </div>
          </div>

          {/* Conflict Evidence Section */}
          {(conflicts.length > 0 || conflictingEvidences.length > 0 || opState === 'SIGNAL CONFLICT') && (
            <div className="bg-rose-950/30 rounded-lg p-3 border border-rose-900/60 space-y-2">
              <div className="flex items-center justify-between text-[10.5px] font-bold border-b border-rose-900/50 pb-1.5">
                <span className="text-rose-400 uppercase tracking-wider flex items-center space-x-1.5">
                  <span>⚠ CONFLICTING FACTORS ({conflicts.length + conflictingEvidences.length})</span>
                </span>
                <span className="text-[9.5px] text-rose-300 font-bold bg-rose-950 px-1.5 py-0.5 rounded border border-rose-800">
                  CONFLICT DETECTED
                </span>
              </div>

              <div className="space-y-1 text-[10px]">
                {conflicts.map((c, i) => (
                  <div key={`c-${i}`} className="flex items-center space-x-2 text-rose-300 bg-rose-950/40 p-1.5 rounded border border-rose-900/40">
                    <span>⚠</span>
                    <span className="font-bold">{c}</span>
                  </div>
                ))}

                {conflictingEvidences.map((ev, i) => (
                  <div key={`ev-${i}`} className="flex items-start justify-between text-rose-300 bg-rose-950/40 p-1.5 rounded border border-rose-900/40">
                    <div className="flex items-center space-x-1.5">
                      <span>⚠</span>
                      <span className="font-bold">{ev.factor_name || ev.evidence_type}</span>
                      {ev.value_str && <span>({ev.value_str})</span>}
                    </div>
                    <span className="text-[9.5px] text-rose-400 max-w-[180px] truncate text-right">
                      {ev.explanation || ev.description}
                    </span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Reason Codes Footer */}
          {reasonCodes.length > 0 && (
            <div className="flex items-center space-x-1.5 flex-wrap text-[9px] pt-1 border-t border-cardBorder/40">
              <span className="text-slate-500 font-bold">REASON CODES:</span>
              {reasonCodes.map((code, idx) => (
                <span key={idx} className="px-1.5 py-0.5 bg-slate-900 text-slate-400 rounded border border-slate-800">
                  {code}
                </span>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ── STEP 6: TRADE GUIDE PANEL ──
    function TradeGuidePanel({ data, activeSymbol, activeStock }) {
      const signal = data?.signal_card || data?.active_signal || {};
      const direction = (signal.direction || 'NEUTRAL').toUpperCase();
      const opState = (signal.operational_state || 'NO SIGNAL').toUpperCase();
      const sellers = data?.sellers || data?.recommendations || [];
      const topSeller = sellers[0] || {};

      const structure = data?.structure || {};
      const smartMoney = data?.smart_money || {};

      // Wall Invalidation derived strictly from backend positioning
      const putWall = smartMoney.put_wall_strike || structure.support_wall || data?.supports?.[0]?.strike;
      const callWall = smartMoney.call_wall_strike || structure.resistance_wall || data?.resistances?.[0]?.strike;

      let invalidationText = 'NOT PROVIDED BY MODEL';
      if (direction.includes('BULL') && putWall) {
        invalidationText = `BEARISH IF PRICE BREAKS PUT WALL FLOOR ₹${putWall.toLocaleString('en-IN')}`;
      } else if (direction.includes('BEAR') && callWall) {
        invalidationText = `BULLISH IF PRICE BREAKS CALL WALL CEILING ₹${callWall.toLocaleString('en-IN')}`;
      } else if (putWall && callWall) {
        invalidationText = `BREAKOUT REQUIRED OUTSIDE RANGE ₹${putWall.toLocaleString('en-IN')} – ₹${callWall.toLocaleString('en-IN')}`;
      }

      // Strategy name
      const strategyName = topSeller.strategy || (
        direction.includes('BULL') ? 'V3 BULLISH PUT SPREAD' :
        direction.includes('BEAR') ? 'V3 BEARISH CALL SPREAD' :
        'V3 NEUTRAL CONDOR / STRANGLE'
      );

      // Option Contract details
      const optionType = topSeller.option_type || (direction.includes('BULL') ? 'PE (PUT)' : direction.includes('BEAR') ? 'CE (CALL)' : 'CE/PE');
      const strikePrice = topSeller.strike || data?.option_chain?.atm || 'ATM Strike';
      const expiryDate = data?.option_chain?.expiry || 'CURRENT EXPIRY';

      // Risk classification derived strictly from backend fields
      let riskStatus = 'MODERATE';
      if (data?.system_health?.data_quality === 'INVALID' || opState === 'SIGNAL CONFLICT') {
        riskStatus = 'HIGH / EXTREME';
      } else if ((signal.confidence >= 75) && (signal.confluence_score >= 70)) {
        riskStatus = 'LOW / MANAGED';
      } else if (signal.confidence < 50) {
        riskStatus = 'ELEVATED / UNCONFIRMED';
      }

      // Conditions from backend
      const breakoutStatus = structure.breakout_status || data?.vcc?.answers?.what_changed || 'NO BREAKOUT';
      const reasonCodes = signal.reason_codes || [];

      return (
        <div className="bg-card rounded-xl border border-cardBorder p-4 font-mono shadow-xl space-y-4">
          {/* Header */}
          <div className="flex items-center justify-between border-b border-cardBorder/60 pb-2.5">
            <div className="flex items-center space-x-2">
              <span className="text-base font-extrabold text-slate-100 tracking-wide uppercase">
                📋 TRADE GUIDE
              </span>
              <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-slate-900 text-bloombergOrange border border-slate-800">
                DECISION CONTEXT
              </span>
            </div>
            <span className="text-[9.5px] text-slate-400">
              No Direct Order Execution
            </span>
          </div>

          {/* Market Bias & Setup Strategy */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-[11px]">
            <div className="bg-bg/80 p-2.5 rounded-lg border border-cardBorder space-y-1">
              <div className="text-[9.5px] text-slate-400 font-bold uppercase">MARKET BIAS</div>
              <div className="text-sm font-black text-amber-300 uppercase">
                {signal.market_regime || 'RANGEBOUND / TWO-SIDED'}
              </div>
              <div className="text-[9.5px] text-slate-400">
                Operational State: <span className="text-slate-200 font-bold">{opState}</span>
              </div>
            </div>

            <div className="bg-bg/80 p-2.5 rounded-lg border border-cardBorder space-y-1">
              <div className="text-[9.5px] text-slate-400 font-bold uppercase">INSTITUTIONAL SETUP</div>
              <div className="text-xs font-extrabold text-emerald-400 uppercase tracking-wide">
                {strategyName}
              </div>
              <div className="text-[9.5px] text-slate-400">
                Target Side: <span className="text-amber-300 font-bold">{topSeller.action || 'SELL'} {optionType}</span>
              </div>
            </div>
          </div>

          {/* Tactical Execution Parameters Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-[10px]">
            {/* ENTRY ZONE */}
            <div className="bg-bg/70 p-2 rounded-lg border border-cardBorder space-y-1">
              <div className="text-slate-400 font-bold flex justify-between">
                <span>ENTRY ZONE</span>
                <span className="text-amber-400">🎯</span>
              </div>
              <div className="text-slate-300 font-bold text-[10.5px]">
                NOT PROVIDED BY MODEL
              </div>
              <div className="text-[8.5px] text-slate-500">
                Client does not manufacture entry price
              </div>
            </div>

            {/* INVALIDATION */}
            <div className="bg-bg/70 p-2 rounded-lg border border-cardBorder space-y-1">
              <div className="text-slate-400 font-bold flex justify-between">
                <span>INVALIDATION / WALL</span>
                <span className="text-rose-400">🛑</span>
              </div>
              <div className="text-rose-300 font-bold text-[10px] leading-tight">
                {invalidationText}
              </div>
              <div className="text-[8.5px] text-slate-500">
                Derived from institutional OI walls
              </div>
            </div>

            {/* TARGET */}
            <div className="bg-bg/70 p-2 rounded-lg border border-cardBorder space-y-1">
              <div className="text-slate-400 font-bold flex justify-between">
                <span>TARGET OBJECTIVE</span>
                <span className="text-emerald-400">🏁</span>
              </div>
              <div className="text-slate-300 font-bold text-[10.5px]">
                NOT PROVIDED BY MODEL
              </div>
              <div className="text-[8.5px] text-slate-500">
                No arbitrary target calculations
              </div>
            </div>
          </div>

          {/* Option Contract Breakdown */}
          <div className="bg-bg/80 rounded-lg p-3 border border-cardBorder space-y-2">
            <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider flex justify-between">
              <span>OPTION CONTRACT DETAIL</span>
              <span className="text-amber-400">EXPIRY: {expiryDate}</span>
            </div>

            <div className="grid grid-cols-3 gap-2 text-[10px] text-center font-mono">
              <div className="bg-slate-900 p-1.5 rounded border border-slate-800">
                <div className="text-slate-400 text-[9px]">OPTION TYPE</div>
                <div className="font-extrabold text-amber-300 text-xs mt-0.5">{optionType}</div>
              </div>
              <div className="bg-slate-900 p-1.5 rounded border border-slate-800">
                <div className="text-slate-400 text-[9px]">RECOMMENDED STRIKE</div>
                <div className="font-extrabold text-slate-100 text-xs mt-0.5">
                  {typeof strikePrice === 'number' ? `₹${strikePrice.toLocaleString('en-IN')}` : strikePrice}
                </div>
              </div>
              <div className="bg-slate-900 p-1.5 rounded border border-slate-800">
                <div className="text-slate-400 text-[9px]">PREFERRED ACTION</div>
                <div className="font-extrabold text-emerald-400 text-xs mt-0.5">{topSeller.action || 'SELL'}</div>
              </div>
            </div>
          </div>

          {/* Risk Status & Execution Conditions */}
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-[10px]">
            {/* Risk Status */}
            <div className="bg-bg/70 p-2.5 rounded-lg border border-cardBorder space-y-1.5">
              <div className="flex justify-between items-center text-[10px] text-slate-400 font-bold">
                <span>RISK STATUS</span>
                <span className={`px-2 py-0.5 rounded text-[9.5px] font-black uppercase ${
                  riskStatus.includes('HIGH') ? 'bg-rose-950 text-rose-300 border border-rose-800' :
                  riskStatus.includes('LOW') ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' :
                  'bg-amber-950 text-amber-300 border border-amber-800'
                }`}>
                  {riskStatus}
                </span>
              </div>
              <div className="text-[9px] text-slate-400">
                Based on VIX elevation, confluence strength & backend conflict metrics.
              </div>
            </div>

            {/* Trade Conditions */}
            <div className="bg-bg/70 p-2.5 rounded-lg border border-cardBorder space-y-1.5">
              <div className="text-[10px] text-slate-400 font-bold uppercase">REQUIRED TRADE CONDITIONS</div>
              <div className="space-y-1 text-[9.5px]">
                <div className="flex items-center space-x-1.5 text-slate-300">
                  <span className="text-amber-400">⚡</span>
                  <span>Breakout Status: <strong className="text-slate-100">{breakoutStatus}</strong></span>
                </div>
                {reasonCodes.slice(0, 2).map((rc, i) => (
                  <div key={i} className="flex items-center space-x-1.5 text-slate-400">
                    <span className="text-emerald-400">✓</span>
                    <span>{rc.replace(/_/g, ' ')}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Non-Actionable Disclaimer Footer */}
          <div className="bg-slate-950 p-2 rounded-lg border border-slate-800 flex items-center justify-between text-[9.5px] text-slate-400">
            <span className="flex items-center space-x-1.5">
              <span>🔒</span>
              <span>READ-ONLY DECISION SUPPORT — NO DIRECT BROKER EXECUTION</span>
            </span>
            <span className="px-2 py-0.5 bg-slate-900 text-slate-300 rounded border border-slate-700 text-[9px]">
              VIEW SETUP ONLY
            </span>
          </div>
        </div>
      );
    }

    // ── STEP 6: DECISION SUPPORT CONTAINER ──
    function DecisionSupportContainer({ data, activeSymbol, activeStock }) {
      return (
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-3 w-full">
          <SignalDecisionPanel data={data} activeSymbol={activeSymbol} activeStock={activeStock} />
          <TradeGuidePanel data={data} activeSymbol={activeSymbol} activeStock={activeStock} />
        </div>
      );
    }

    // ── STOCK INTELLIGENCE & SCANNERS COMPONENT ──
    function StockIntelligenceTab({ playChime }) {
      const [stockData, setStockData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [stockTab, setStockTab] = useState('fno');
      const [sectorFilter, setSectorFilter] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedStockChart, setSelectedStockChart] = useState(null);
      const [chartData, setChartData] = useState([]);
      const [loadingChart, setLoadingChart] = useState(false);

      const fetchStockData = async () => {
        try {
          const res = await fetch('/api/stocks/market-data');
          const json = await res.json();
          if (json) {
            setStockData(json);
          }
        } catch (e) {
          console.error("Error fetching stock market data:", e);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchStockData();
        const interval = setInterval(fetchStockData, 15000);
        return () => clearInterval(interval);
      }, []);

      const openChartModal = async (symbol) => {
        setSelectedStockChart(symbol);
        setLoadingChart(true);
        try {
          const res = await fetch(`/api/stocks/historical/${symbol}`);
          const json = await res.json();
          setChartData(json || []);
        } catch (e) {
          console.error("Error fetching stock historical data:", e);
          setChartData([]);
        } finally {
          setLoadingChart(false);
        }
      };

      const [selectedStockOptionChain, setSelectedStockOptionChain] = useState(null);
      const [optionChainData, setOptionChainData] = useState(null);
      const [loadingOptionChain, setLoadingOptionChain] = useState(false);

      const openStockOptionChainModal = async (symbol) => {
        const cleanSym = symbol.replace('.NS', '').replace('NSE:', '').split('-')[0].trim();
        setSelectedStockOptionChain(cleanSym);
        setLoadingOptionChain(true);
        try {
          const res = await fetch(`/api/option-chain/${cleanSym}`);
          const json = await res.json();
          setOptionChainData(json || null);
        } catch (e) {
          console.error("Error fetching stock option chain:", e);
          setOptionChainData(null);
        } finally {
          setLoadingOptionChain(false);
        }
      };

      const g1 = stockData?.gainers_1d || [];
      const l1 = stockData?.losers_1d || [];
      const g5 = stockData?.gainers_5d || [];
      const l5 = stockData?.losers_5d || [];
      const fiiDii = stockData?.fii_dii || [];
      const sectors = stockData?.sectoral_heatmap || [];
      const earlyOpp = stockData?.early_opportunities || { top_gainers: [], top_losers: [] };

      const getFilteredList = (list) => {
        return list.filter(item => {
          const matchSector = sectorFilter === 'ALL' || (item.sector && item.sector.toLowerCase().includes(sectorFilter.toLowerCase()));
          const matchSearch = !searchQuery || item.symbol.toLowerCase().includes(searchQuery.toLowerCase()) || (item.nse_symbol && item.nse_symbol.toLowerCase().includes(searchQuery.toLowerCase()));
          return matchSector && matchSearch;
        });
      };

      let activeGainers = [];
      let activeLosers = [];

      if (stockTab === 'fno') {
        activeGainers = getFilteredList(g1.filter(x => x.is_fno));
        activeLosers  = getFilteredList(l1.filter(x => x.is_fno));
      } else if (stockTab === '1d') {
        activeGainers = getFilteredList(g1);
        activeLosers  = getFilteredList(l1);
      } else if (stockTab === '5d') {
        activeGainers = getFilteredList(g5);
        activeLosers  = getFilteredList(l5);
      } else if (stockTab === 'common') {
        const g5Symbols = new Set(g5.map(x => x.symbol));
        const l5Symbols = new Set(l5.map(x => x.symbol));
        activeGainers = getFilteredList(g1.filter(x => g5Symbols.has(x.symbol)));
        activeLosers  = getFilteredList(l1.filter(x => l5Symbols.has(x.symbol)));
      }

      const latestFii = fiiDii.length ? fiiDii[0] : null;

      return (
        <div className="bg-card rounded border border-cardBorder p-3 sm:p-4 flex-1 font-mono shadow space-y-4">
          {/* 1. TOP PULSE & SEARCH STRIP */}
          <div className="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-cardBorder">
            <div className="flex items-center space-x-2">
              <span className="text-sm">⚡</span>
              <span className="font-bold text-slate-200 text-xs sm:text-sm uppercase tracking-wider">
                STOCK INTELLIGENCE & SCANNERS
              </span>
              <span className="px-2 py-0.5 bg-emerald-950 text-bull text-[9.5px] rounded border border-emerald-800 font-bold">
                MONEYCONTROL CLOUD ENGINE
              </span>
            </div>

            <div className="flex items-center space-x-2">
              <input
                type="text"
                placeholder="🔍 Search stock..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="bg-bg text-slate-200 border border-cardBorder rounded px-2.5 py-1 text-[10px] focus:outline-none focus:border-bloombergOrange"
              />
            </div>
          </div>

          {/* 2. FII/DII & MARKET OVERVIEW ROW */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[10px]">
            <div className="bg-bg p-2.5 rounded border border-cardBorder">
              <div className="text-slate-400 font-semibold">FII CASH NET</div>
              <div className={`text-sm font-bold ${latestFii && parseFloat(latestFii.fiiNet || 0) >= 0 ? 'text-bull' : 'text-bear'}`}>
                {latestFii ? `₹${latestFii.fiiNet} Cr` : '—'}
              </div>
              <div className="text-[9px] text-slate-500">Buy: ₹{latestFii?.fiiBuy || '0'} | Sell: ₹{latestFii?.fiiSell || '0'}</div>
            </div>

            <div className="bg-bg p-2.5 rounded border border-cardBorder">
              <div className="text-slate-400 font-semibold">DII CASH NET</div>
              <div className={`text-sm font-bold ${latestFii && parseFloat(latestFii.diiNet || 0) >= 0 ? 'text-bull' : 'text-bear'}`}>
                {latestFii ? `₹${latestFii.diiNet} Cr` : '—'}
              </div>
              <div className="text-[9px] text-slate-500">Buy: ₹{latestFii?.diiBuy || '0'} | Sell: ₹{latestFii?.diiSell || '0'}</div>
            </div>

            <div className="bg-bg p-2.5 rounded border border-cardBorder">
              <div className="text-slate-400 font-semibold">NIFTY 50 INDEX</div>
              <div className="text-sm font-bold text-slate-100">
                {stockData?.market_intel?.nifty?.value || '—'}
              </div>
              <div className={`text-[9px] font-bold ${parseFloat(stockData?.market_intel?.nifty?.change || 0) >= 0 ? 'text-bull' : 'text-bear'}`}>
                {stockData?.market_intel?.nifty?.pChange ? `${stockData.market_intel.nifty.pChange}%` : '—'}
              </div>
            </div>

            <div className="bg-bg p-2.5 rounded border border-cardBorder">
              <div className="text-slate-400 font-semibold">INDIA VIX</div>
              <div className="text-sm font-bold text-amber-300">
                {stockData?.market_intel?.india_vix?.value || '—'}
              </div>
              <div className="text-[9px] text-slate-500">Market Volatility Index</div>
            </div>
          </div>

          {/* 3. EARLY OPPORTUNITIES (EMS ENGINE PICKS) */}
          <div className="space-y-2">
            <div className="flex items-center justify-between text-[11px] font-bold pb-1 border-b border-cardBorder">
              <span className="text-slate-200">🎯 EARLY MOMENTUM RECOGNITION (EMS ENGINE)</span>
              <span className="text-bloombergOrange text-[9.5px]">HIGH CONVICTION PICKS</span>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
              {/* BULLISH CARDS */}
              <div className="bg-bg p-2.5 rounded border border-emerald-900/60 space-y-2">
                <div className="text-emerald-400 font-bold text-[10.5px] flex items-center space-x-1">
                  <span>🟢 BULLISH EMS PICKS (BUY CONVICTION)</span>
                </div>

                {!earlyOpp.top_gainers || earlyOpp.top_gainers.length === 0 ? (
                  <div className="text-slate-500 text-[10px] text-center py-4">Scanning market for bullish breakouts...</div>
                ) : (
                  earlyOpp.top_gainers.map((item, idx) => (
                    <div key={item.symbol || idx} className="bg-card p-2 rounded border border-cardBorder hover:border-emerald-700 transition space-y-1">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center space-x-1.5">
                          <span className="font-bold text-slate-100 text-xs">{item.symbol}</span>
                          {item.is_fno && <span className="px-1 py-0.2 bg-blue-950 text-blue-300 text-[8px] rounded border border-blue-800 font-bold">F&amp;O</span>}
                          {item.badge === 'Vol Shocker' && <span className="px-1 py-0.2 bg-amber-950 text-amber-300 text-[8px] rounded border border-amber-800 font-bold">⚡ VOL</span>}
                        </div>
                        <div className="flex items-center space-x-2">
                          <span className="text-emerald-400 font-bold text-xs">₹{item.ltp}</span>
                          <span className="text-bull font-bold text-[10px]">+{item.pChange}%</span>
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-[9px]">
                        <div className="flex items-center space-x-2 text-slate-400">
                          <span>Score: <b className="text-emerald-300">{item.eps}/100</b></span>
                          <span>Vol: <b className="text-slate-200">{item.rel_vol_label} ({item.relative_volume}x)</b></span>
                          <span>VWAP: <b className="text-amber-300">{item.vwap_distance_label}</b></span>
                        </div>
                        <div className="flex items-center space-x-1">
                          <button
                            onClick={() => openChartModal(item.nse_symbol || item.symbol)}
                            className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[8.5px] border border-cardBorder cursor-pointer"
                          >
                            📊 5D Chart
                          </button>
                          <button
                            onClick={() => openStockOptionChainModal(item.nse_symbol || item.symbol)}
                            className="px-1.5 py-0.5 bg-bloombergOrange/20 hover:bg-bloombergOrange/40 text-bloombergOrange font-bold rounded text-[8.5px] border border-bloombergOrange/40 cursor-pointer"
                          >
                            ⚡ Option Chain
                          </button>
                        </div>
                      </div>

                      {item.reasons && item.reasons.length > 0 && (
                        <div className="flex flex-wrap gap-1 pt-1">
                          {item.reasons.map((r, i) => (
                            <span key={i} className="px-1 bg-emerald-950/80 text-emerald-300 text-[8px] rounded border border-emerald-800/60">
                              {r}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>

              {/* BEARISH CARDS */}
              <div className="bg-bg p-2.5 rounded border border-rose-900/60 space-y-2">
                <div className="text-rose-400 font-bold text-[10.5px] flex items-center space-x-1">
                  <span>🔴 BEARISH EMS PICKS (SELL / SHORT)</span>
                </div>

                {!earlyOpp.top_losers || earlyOpp.top_losers.length === 0 ? (
                  <div className="text-slate-500 text-[10px] text-center py-4">Scanning market for bearish breakdowns...</div>
                ) : (
                  earlyOpp.top_losers.map((item, idx) => (
                    <div key={item.symbol || idx} className="bg-card p-2 rounded border border-cardBorder hover:border-rose-700 transition space-y-1">
                      <div className="flex items-center justify-between">
                        <div className="flex items-center space-x-1.5">
                          <span className="font-bold text-slate-100 text-xs">{item.symbol}</span>
                          {item.is_fno && <span className="px-1 py-0.2 bg-blue-950 text-blue-300 text-[8px] rounded border border-blue-800 font-bold">F&amp;O</span>}
                          {item.badge === 'Vol Shocker' && <span className="px-1 py-0.2 bg-amber-950 text-amber-300 text-[8px] rounded border border-amber-800 font-bold">⚡ VOL</span>}
                        </div>
                        <div className="flex items-center space-x-2">
                          <span className="text-rose-400 font-bold text-xs">₹{item.ltp}</span>
                          <span className="text-bear font-bold text-[10px]">{item.pChange}%</span>
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-[9px]">
                        <div className="flex items-center space-x-2 text-slate-400">
                          <span>Score: <b className="text-rose-300">{item.eps}/100</b></span>
                          <span>Vol: <b className="text-slate-200">{item.rel_vol_label} ({item.relative_volume}x)</b></span>
                          <span>VWAP: <b className="text-amber-300">{item.vwap_distance_label}</b></span>
                        </div>
                        <div className="flex items-center space-x-1">
                          <button
                            onClick={() => openChartModal(item.nse_symbol || item.symbol)}
                            className="px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded text-[8.5px] border border-cardBorder cursor-pointer"
                          >
                            📊 5D Chart
                          </button>
                          <button
                            onClick={() => openStockOptionChainModal(item.nse_symbol || item.symbol)}
                            className="px-1.5 py-0.5 bg-bloombergOrange/20 hover:bg-bloombergOrange/40 text-bloombergOrange font-bold rounded text-[8.5px] border border-bloombergOrange/40 cursor-pointer"
                          >
                            ⚡ Option Chain
                          </button>
                        </div>
                      </div>

                      {item.reasons && item.reasons.length > 0 && (
                        <div className="flex flex-wrap gap-1 pt-1">
                          {item.reasons.map((r, i) => (
                            <span key={i} className="px-1 bg-rose-950/80 text-rose-300 text-[8px] rounded border border-rose-800/60">
                              {r}
                            </span>
                          ))}
                        </div>
                      )}
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>

          {/* 4. TABBED GAINERS & LOSERS TERMINAL */}
          <div className="space-y-2">
            <div className="flex items-center justify-between pb-1 border-b border-cardBorder">
              <div className="flex items-center space-x-1 font-mono text-[10px]">
                {[
                  { id: 'fno', label: '🎯 F&O Momentum' },
                  { id: 'common', label: '⚡ Common 1D+5D' },
                  { id: '1d', label: '📊 Today 1D' },
                  { id: '5d', label: '📈 Weekly 5D' },
                ].map(t => (
                  <button
                    key={t.id}
                    onClick={() => setStockTab(t.id)}
                    className={`px-2.5 py-1 rounded font-bold cursor-pointer transition ${
                      stockTab === t.id ? 'bg-bloombergOrange text-black shadow' : 'bg-bg text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {t.label}
                  </button>
                ))}

        status: 'HIGH',
        direction: 'UPSIDE PRESSURE',
        started_time: '10:52 IST',
        age_formatted: '24m',
        reliability_pct: sigMeta.reliability || 82.5,
        checklist: [
          'CE wall weakening',
          '5m Net OI Flow: +2.4L',
          'Price Velocity: +18.5 pts',
          'Distance to CE Wall: 25 pts',
          'PCR Level: 0.97',
          'Breakout Pressure: 87/100'
        ]
      };
      const rangeCompression = vccIntel.range_compression || {
        score: 91,
        status: 'HIGH COMPRESSION',
        started_time: '10:42 IST',
        age_formatted: '34m',
        reliability_pct: sigMeta.reliability || 98.5,
        checklist: [
          'Spot 15m velocity: +4.2 pts (declining)',
          'ATM Straddle status: active range compression',
          'IV Level: 14.2 (stable)',
          'Walls strengthening: PE 24000 / CE 24200',
          'Spot Position: Inside 24000 - 24200 boundary'
        ]
      };

      const narrativeTimeline = vccIntel.narrative_timeline || [
        { time: '09:42', text: '24,000 PE Writing Started', icon: '✓' },
        { time: '10:04', text: '24,000 Support Strengthened', icon: '✓' },
        { time: '10:17', text: 'PCR Crossed Intraday Level', icon: '✓' },
        { time: '10:41', text: 'ATM Straddle Compression', icon: '✓' },
        { time: '11:08', text: 'Regime Changed To Bullish', icon: '✓' }
      ];

      const marketStateStrip = vccIntel.market_state_strip || {
        option_structure: positioning.label,
        price_action: priceConf.label,
        breakout: breakoutEngine.status,
        regime: confluence.label,
        state: confluence.is_conflict ? 'WAIT / DEVELOPING SETUP' : 'CONFIRMED ENTRY'

      return (
        <div className="flex-1 flex flex-col space-y-3 p-2 sm:p-3 max-w-[1920px] mx-auto w-full font-mono bg-bg text-slate-200 relative">
          
          {/* 🌟 MASTER POSITIONING VS PRICE CONFLUENCE HEADER BLOCK */}
          <div className="bg-card rounded-lg border border-cardBorder p-2.5 shadow-xl font-mono">
            <div className="flex flex-col md:flex-row items-center justify-between gap-2 border-b border-cardBorder/60 pb-2 mb-2">
              <div className="flex items-center space-x-3 flex-wrap gap-y-1">

                  <span className="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
                  <span>OPTION POSITIONING vs PRICE CONFLUENCE ENGINE (V3)</span>

                <span className={`px-2 py-0.5 rounded text-[9px] font-bold ${
                  confluence.is_conflict ? 'bg-amber-950 text-amber-300 border border-amber-600 animate-pulse' :
                  confluence.score >= 65 ? 'bg-emerald-950 text-emerald-300 border border-emerald-700' :
                  confluence.score <= 35 ? 'bg-rose-950 text-rose-300 border border-rose-700' : 'bg-slate-800 text-slate-300'

                {/* Visual Cockpit Dedicated Index Selector */}

                    <button
                      key={sym}
                      onClick={() => handleSymbolChange ? handleSymbolChange(sym) : setSelectedSymbol(sym)}

                          ? 'bg-cyan-500 text-black font-extrabold shadow-[0_0_8px_rgba(6,182,212,0.6)]'
                          : 'text-slate-400 hover:text-cyan-200'

              <div className="flex items-center space-x-4 text-[10px]">

                <div><span className="text-slate-400">AGE:</span> <span className="text-slate-200 font-bold">{sigMeta.age_formatted}</span></div>
                <div><span className="text-slate-400">CONFIDENCE:</span> <span className="text-emerald-400 font-bold">{sigMeta.signal_confidence || sigMeta.reliability}%</span></div>
                <button 
                  onClick={() => setShowWhyModal(true)} 
                  className="px-2 py-0.5 bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-700 rounded text-[9px] font-bold transition flex items-center space-x-1"

                  <span>🔍 WHY?</span>
                </button>
              </div>
            </div>

            {/* Signal Conflict Alert Banner */}
            {confluence.is_conflict && (
              <div className="bg-amber-950/80 border border-amber-600/80 p-2 rounded mb-2 text-[10px] text-amber-200 flex items-center justify-between">
                <div className="flex items-center space-x-2">
                  <span className="text-base">⚠️</span>
                  <div>
                    <span className="font-bold text-amber-300">{confluence.conflict_type}: </span>
                    <span>{confluence.conflict_details.join(' ')}</span>

                <span className="px-2 py-0.5 bg-amber-900 text-amber-200 font-bold text-[8.5px] rounded border border-amber-500">

                </span>
              </div>
            )}

            {/* 3 Core Bars Breakdown */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-2">
              {/* Option Positioning */}
              <div className="bg-slate-950 p-2 rounded border border-cardBorder">
                <div className="flex justify-between text-[9.5px] mb-1">
                  <span className="text-slate-400 font-bold">OPTION POSITIONING</span>
                  <span className={`font-bold ${positioning.score >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {positioning.score >= 0 ? '+' : ''}{positioning.score} ({positioning.label})
                  </span>
                </div>
                <div className="w-full bg-slate-900 h-2.5 rounded overflow-hidden relative border border-cardBorder">
                  <div 
                    className={`h-full ${positioning.score >= 0 ? 'bg-emerald-500' : 'bg-rose-500'}`} 
                    style={{ width: `${Math.abs(positioning.score)}%` }}

                </div>
              </div>

              {/* Price Confirmation */}
              <div className="bg-slate-950 p-2 rounded border border-cardBorder">
                <div className="flex justify-between text-[9.5px] mb-1">
                  <span className="text-slate-400 font-bold">PRICE CONFIRMATION</span>
                  <span className={`font-bold ${priceConf.score >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                    {priceConf.score >= 0 ? '+' : ''}{priceConf.score} ({priceConf.label})
                  </span>
                </div>
                <div className="w-full bg-slate-900 h-2.5 rounded overflow-hidden relative border border-cardBorder">
                  <div 
                    className={`h-full ${priceConf.score >= 0 ? 'bg-cyan-500' : 'bg-rose-500'}`} 
                    style={{ width: `${Math.abs(priceConf.score)}%` }}

                </div>
              </div>

              {/* Final Confluence */}
              <div className="bg-slate-950 p-2 rounded border border-cardBorder">
                <div className="flex justify-between text-[9.5px] mb-1">
                  <span className="text-slate-400 font-bold">FINAL CONFLUENCE</span>
                  <span className={`font-bold ${confluence.score >= 60 ? 'text-emerald-400' : (confluence.score <= 40 ? 'text-rose-400' : 'text-amber-400')}`}>
                    {confluence.score}/100
                  </span>
                </div>
                <div className="w-full bg-slate-900 h-2.5 rounded overflow-hidden relative border border-cardBorder">
                  <div 
                    className={`h-full ${confluence.score >= 60 ? 'bg-emerald-500' : (confluence.score <= 40 ? 'bg-rose-500' : 'bg-amber-500')}`} 
                    style={{ width: `${confluence.score}%` }}
                  ></div>
                </div>
              </div>
            </div>

            {/* 🌟 COMPACT MARKET STATE STRIP (V3 REQUIREMENT #20) */}
            <div className="mt-2 bg-slate-950 p-2 rounded border border-cyan-900/60 grid grid-cols-2 sm:grid-cols-5 gap-2 text-[9.5px] font-mono text-center">
              <div>
                <span className="text-slate-400 block text-[8.5px] uppercase">OPTION STRUCTURE</span>

              </div>
              <div>
                <span className="text-slate-400 block text-[8.5px] uppercase">PRICE ACTION</span>
                <span className={`font-extrabold ${priceConf.score >= 0 ? 'text-cyan-400' : 'text-rose-400'}`}>{marketStateStrip.price_action}</span>
              </div>
              <div>
                <span className="text-slate-400 block text-[8.5px] uppercase">BREAKOUT STATUS</span>
                <span className="font-extrabold text-amber-300">{marketStateStrip.breakout}</span>
              </div>
              <div>
                <span className="text-slate-400 block text-[8.5px] uppercase">CONFLUENCE REGIME</span>
                <span className="font-extrabold text-cyan-300">{marketStateStrip.regime}</span>
              </div>
              <div>
                <span className="text-slate-400 block text-[8.5px] uppercase">OPERATIONAL STATE</span>

                  {marketStateStrip.state}
                </span>
              </div>
            </div>

            {/* 🌟 LIVE MODEL PERFORMANCE COMPACT STRIP (REQUIREMENT #16) */}
            <div className="mt-2 bg-slate-950 p-2 rounded border border-emerald-900/60 flex flex-col sm:flex-row items-center justify-between gap-2 text-[9.5px] font-mono">
              <div className="flex items-center space-x-3 flex-wrap gap-y-1">
                <span className="font-extrabold uppercase tracking-wider text-emerald-400 flex items-center space-x-1">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                  <span>LIVE MODEL PERFORMANCE</span>
                </span>
                <div className="flex items-center space-x-2 text-slate-300 flex-wrap gap-y-1">
                  <span>TODAY: <b className="text-white">{auditDaily.total_signals || 0}</b></span>
                  <span>VALID: <b className="text-emerald-400">{auditDaily.valid_signals || 0}</b></span>
                  <span>5M ACC: <b className="text-cyan-300">{auditDaily.outcomes?.accuracy_5m_pct || 0}%</b></span>
                  <span>15M ACC: <b className="text-emerald-300">{auditDaily.outcomes?.accuracy_15m_pct || 0}%</b></span>
                  <span>30M ACC: <b className="text-indigo-300">{auditDaily.outcomes?.accuracy_30m_pct || 0}%</b></span>
                  <span>MFE/MAE: <b className="text-emerald-400">+{auditDaily.excursions?.avg_mfe_pct || 0}%</b> / <b className="text-rose-400">-{auditDaily.excursions?.avg_mae_pct || 0}%</b></span>
                  <span className="px-1.5 py-0.5 rounded bg-slate-900 text-amber-300 border border-slate-700 font-bold">{auditDaily.sample_quality || 'INSUFFICIENT SAMPLE'}</span>
                  <span className={`px-1.5 py-0.5 rounded font-bold ${auditDaily.invalid_data_signals > 0 ? 'bg-rose-950 text-rose-300 border border-rose-700' : 'bg-emerald-950 text-emerald-300 border border-emerald-700'}`}>

                  </span>
                </div>
              </div>
              <button
                onClick={() => setShowAuditModal(true)}
                className="px-2.5 py-1 bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-700 rounded text-[9.5px] font-bold cursor-pointer transition shrink-0 shadow-lg"
              >
                [ VIEW PERFORMANCE ]
              </button>
            </div>
          </div>



          {/* SECTION 1: TOP 3 COCKPIT MODULES */}
          <div className="grid grid-cols-12 gap-2 sm:gap-3">
            
            {/* 1A. SMART MONEY CONVICTION SPEEDOMETER */}
            <div className="col-span-12 md:col-span-4 bg-card rounded-lg border border-cardBorder p-3 shadow-xl flex flex-col justify-between relative overflow-hidden">
              <div className="flex items-center justify-between border-b border-cardBorder/60 pb-1.5">

              <div className="text-[9.5px] text-slate-400 font-mono mt-1">

              </div>

              {/* Speedometer Arc SVG */}

                    <linearGradient id="speedoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                      <stop offset="0%" stopColor="#ef4444" />
                      <stop offset="35%" stopColor="#f59e0b" />
                      <stop offset="70%" stopColor="#06b6d4" />
                      <stop offset="100%" stopColor="#10b981" />
                    </linearGradient>
                  </defs>
                  <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="#1e2638" strokeWidth="16" strokeLinecap="round" />
                  <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="url(#speedoGrad)" strokeWidth="12" strokeLinecap="round" />
                  
                  {/* Rotating Needle */}
                  <g transform={`translate(100, 100) rotate(${needleAngle})`}>
                    <line x1="0" y1="0" x2="0" y2="-66" stroke="#ffffff" strokeWidth="3" strokeLinecap="round" />
                    <circle cx="0" cy="0" r="6" fill="#ff8800" stroke="#ffffff" strokeWidth="2" />
                  </g>
                </svg>

                {/* Score & Label */}
                <div className="text-center -mt-6">
                  <div className="text-3xl font-extrabold text-white tracking-tight">

                  <div className="text-xs font-bold uppercase tracking-wider text-emerald-400 mt-0.5">
                    {confluence.label}
                  </div>
                </div>
              </div>

              {/* Sub Breakdown metrics */}
              <div className="grid grid-cols-3 gap-1 text-[8.5px] font-mono bg-slate-950 p-1.5 rounded border border-cardBorder text-center mb-1">
                <div>POSITIONING: <b className="text-emerald-400 block">+{positioning.score}</b></div>
                <div>PRICE CONF: <b className="text-cyan-400 block">+{priceConf.score}</b></div>
                <div>RELIABILITY: <b className="text-slate-100 block">{sigMeta.reliability}%</b></div>
              </div>

              {/* Footer Trend Tag */}
              <div className="w-full bg-slate-950/80 px-2.5 py-1 rounded border border-cardBorder text-center text-[10px] text-emerald-300 font-bold flex items-center justify-center space-x-2">
                <span>STATUS:</span>
                <span className="text-bull font-extrabold">🟢 {confluence.label}</span>
                <span>🔄 ACCELERATING</span>
              </div>
            </div>

            {/* 1B. INSTITUTIONAL FLOW MOMENTUM */}
            <div className="col-span-12 md:col-span-4 bg-card rounded-lg border border-cardBorder p-3 shadow-xl flex flex-col justify-between">
              <div className="flex items-center justify-between border-b border-cardBorder/60 pb-1.5">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-200">
                  INSTITUTIONAL FLOW MOMENTUM
                </span>
              </div>

              {/* Velocity Header */}
              <div className="flex items-center justify-between my-1 bg-slate-950 p-2 rounded border border-cardBorder">
                <div>
                  <div className="text-[9px] text-slate-400 font-bold uppercase">5 MIN FLOW VELOCITY</div>
                  <div className="text-lg font-bold text-emerald-400 flex items-center space-x-1">
                    <span>+{flowEng.net_flow_lakhs}L</span>
                    <span className="text-[10px] text-emerald-300 font-normal">↗ {flowEng.flow_status}</span>
