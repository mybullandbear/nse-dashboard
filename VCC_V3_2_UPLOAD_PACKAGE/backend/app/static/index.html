<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Options Seller Terminal | Institutional Dashboard</title>
  <meta name="description" content="Institutional-grade decision support system for intraday option sellers. Short premium, Iron Condor, ATM Straddle Decay, Strike Wall Heatmap, PCR, OI analytics.">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#080a0f',
            card: '#0f131c',
            cardBorder: '#1e2638',
            bloombergOrange: '#ff8800',
            bull: '#10b981',
            bear: '#ef4444',
            accent: '#3b82f6',
            warning: '#f59e0b',
            muted: '#6b7280'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM & Babel (Cloudflare & jsDelivr Multi-CDN for 100% Reliability) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin></script>

  <!-- Charting Libraries & Icons -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    :root {
      --bg-main: #080a0f;
      --panel-bg: #0f131c;
      --panel-hover: #161c2a;
      --border-color: #1e2638;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --color-bull: #10b981;
      --color-bear: #ef4444;
      --color-warning: #f59e0b;
      --color-neutral: #3b82f6;
      --color-accent: #ff8800;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #374151;
    }

    .terminal-panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      padding: 0.75rem;
      transition: border-color 0.2s ease, background-color 0.2s ease;
    }
    .terminal-panel:hover {
      border-color: #2e3b54;
    }

    .bloomberg-glow {
      box-shadow: 0 0 15px rgba(255, 136, 0, 0.15);
    }
    .bull-glow {
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
    }
    .bear-glow {
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }
    .pulse-subtle {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Mobile Responsive Polish */
    @media (max-width: 768px) {
      .hide-mobile { display: none !important; }
      .mobile-padding { padding: 0.5rem !important; }
      .mobile-text-xs { font-size: 10px !important; }
      .mobile-table-compact th, .mobile-table-compact td {
        padding: 4px 5px !important;
        font-size: 9.5px !important;
      }
      .mobile-grid-1 { grid-template-columns: repeat(1, minmax(0, 1fr)) !important; }
    }
  </style>
</head>
<body class="bg-bg text-slate-200 antialiased selection:bg-bloombergOrange selection:text-black">
  <div id="root">
    <div style="min-height:100vh; background:#080a0f; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:'JetBrains Mono', monospace; color:#ff8800; padding:20px;">
      <div style="font-size:20px; font-weight:bold; letter-spacing:1px; margin-bottom:12px; display:flex; items-center; gap:8px;">
        <span style="display:inline-block; width:12px; height:12px; border-radius:50%; background:#ff8800;"></span>
        ALPHA-SELL TERMINAL
      </div>
      <div style="font-size:12px; color:#94a3b8; margin-bottom:20px;">Initializing Institutional Dashboard & Stock Intelligence...</div>
      <div style="display:inline-block; width:36px; height:36px; border:3px solid #1e2638; border-top-color:#ff8800; border-radius:50%; animation:spin 1s linear infinite;"></div>
      <style>
      html, body {
        overflow-x: hidden;
        width: 100%;
        max-width: 100vw;
      }
      /* Custom smooth touch scrollbar */
      .scrollbar-none::-webkit-scrollbar { display: none; }
      .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes slideInLeft {
        from { transform: translateX(-100%); }
        to { transform: translateX(0); }
      }
      .animate-slide-in-left {
        animation: slideInLeft 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
    </div>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ── Helper Functions ──
    const formatNumber = (num, decimals = 2) => {
      if (num === undefined || num === null || isNaN(num)) return '0.00';
      return new Intl.NumberFormat('en-IN', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      }).format(num);
    };

    const formatCurrency = (val, decimals = 2) => {
      if (val === undefined || val === null) return '₹0.00';
      const num = typeof val === 'number' ? val : parseFloat(val);
      if (isNaN(num)) return '₹0.00';
      return '₹' + new Intl.NumberFormat('en-IN', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals,
      }).format(num);
    };

    const formatOI = (num) => {
      if (!num || isNaN(num)) return '0';
      if (Math.abs(num) >= 10000000) return (num / 10000000).toFixed(2) + ' Cr';
      if (Math.abs(num) >= 100000) return (num / 100000).toFixed(2) + ' L';
      if (Math.abs(num) >= 1000) return (num / 1000).toFixed(1) + ' K';
      return num.toString();
    };

    const formatTimestamp = (ts) => {
      if (!ts) return new Date().toLocaleTimeString('en-IN', { hour12: false }) + ' IST';
      try {
        const d = new Date(ts);
        if (isNaN(d.getTime())) return ts;
        return d.toLocaleTimeString('en-IN', { hour12: false }) + ' IST';
      } catch (e) {
        return ts;
      }
    };

    // ── VCC V3.2 CENTRALIZED DATA LAYER & HOOKS (STEP 1 FOUNDATION) ──
    const DATA_STATES = {
      AVAILABLE: 'DATA_AVAILABLE',
      STALE: 'DATA_STALE',
      UNAVAILABLE: 'DATA_UNAVAILABLE',
      MARKET_CLOSED: 'MARKET_CLOSED',
      INVALID: 'DATA_QUALITY_INVALID'
    };

    function DataStatusBadge({ status, source = 'FYERS_LIVE', age = 0 }) {
      let badgeColor = 'bg-emerald-950/80 text-emerald-300 border-emerald-700';
      let label = 'LIVE';
      
      if (status === DATA_STATES.MARKET_CLOSED) {
        badgeColor = 'bg-amber-950/80 text-amber-300 border-amber-700';
        label = 'MARKET CLOSED';
      } else if (status === DATA_STATES.STALE || age > 30) {
        badgeColor = 'bg-amber-950/80 text-amber-300 border-amber-700';
        label = `STALE (${Math.round(age)}s)`;
      } else if (status === DATA_STATES.UNAVAILABLE) {
        badgeColor = 'bg-rose-950/80 text-rose-300 border-rose-700';
        label = 'DISCONNECTED';
      } else if (status === DATA_STATES.INVALID) {
        badgeColor = 'bg-rose-950/80 text-rose-300 border-rose-700';
        label = 'QUALITY INVALID';
      }

      return (
        <span className={`inline-flex items-center space-x-1 px-2 py-0.5 rounded text-[10px] font-mono font-bold border ${badgeColor}`}>
          <span className="w-1.5 h-1.5 rounded-full bg-current animate-pulse"></span>
          <span>{label}</span>
          <span className="opacity-60 text-[9px]">[{source}]</span>
        </span>
      );
    }

    // Centralized Custom React Hooks
    function useMarketData(symbol = 'NIFTY') {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [dataState, setDataState] = useState(DATA_STATES.AVAILABLE);

      useEffect(() => {
        let isMounted = true;
        const fetchData = async () => {
          try {
            const res = await fetch(`/api/vcc/dashboard/${symbol}`);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const json = await res.json();
            if (isMounted) {
              setData(json);
              setError(null);
              setLoading(false);
              if (json.system_health?.market_open === false) {
                setDataState(DATA_STATES.MARKET_CLOSED);
              } else {
                setDataState(DATA_STATES.AVAILABLE);
              }
            }
          } catch (err) {
            if (isMounted) {
              setError(err.message);
              setDataState(DATA_STATES.UNAVAILABLE);
              setLoading(false);
            }
          }
        };
        fetchData();
        const interval = setInterval(fetchData, 4000);
        return () => { isMounted = false; clearInterval(interval); };
      }, [symbol]);

      return { data, loading, error, dataState };
    }

    function useMarketStatus() {
      const [status, setStatus] = useState({ market_open: true, session_state: 'OPEN', is_live: true, session_slot: 'REGULAR SESSION' });
      useEffect(() => {
        fetch('/api/vcc/dashboard/NIFTY')
          .then(r => r.json())
          .then(d => {
            if (d && d.market_state) {
              setStatus({
                market_open: d.market_state.is_market_live ?? true,
                session_state: d.market_state.session_state || 'OPEN',
                is_live: d.data_source === 'FYERS_LIVE',
                session_slot: d.market_state.operational_state || 'REGULAR SESSION'
              });
            }
          })
          .catch(() => {});
      }, []);
      return status;
    }

    function useIndexData() {
      const [data, setData] = useState({
        indices: [],
        vix: { current: 13.50, change: 0.0, pct_change: 0.0, trend: 'flat' },
        breadth: { advances: 31, declines: 18, unchanged: 1, adr: 1.72 }
      });
      useEffect(() => {
        let isMounted = true;
        const fetchIndices = async () => {
          try {
            const r = await fetch('/api/indices');
            if (!r.ok) return;
            const d = await r.json();
            if (isMounted && d) {
              if (Array.isArray(d)) {
                setData(prev => ({ ...prev, indices: d }));
              } else if (d.indices) {
                setData(d);
              }
            }
          } catch (e) {}
        };
        fetchIndices();
        const interval = setInterval(fetchIndices, 4000);
        return () => { isMounted = false; clearInterval(interval); };
      }, []);
      return data;
    }

    function useSystemHealth() {
      const [health, setHealth] = useState({ active_provider: 'FYERS_LIVE', is_healthy: true, db_status: 'CONNECTED' });
      useEffect(() => {
        fetch('/api/vcc/system-health')
          .then(r => r.json())
          .then(d => setHealth(d))
          .catch(() => {});
      }, []);
      return health;
    }

    // ── STEP 1 MODULAR DASHBOARD COMPONENTS ──

    // 1. Sidebar Component (Responsive Desktop Sidebar & Mobile Drawer)
    function Sidebar({ activeNav, setActiveNav, systemHealth, fyersStatus, onNavClick, isMobileOpen, onCloseMobile }) {
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: '📊' },
        { id: 'market-overview', label: 'Market Overview', icon: '🌐' },
        { id: 'smart-money', label: 'Smart Money', icon: '⚡' },
        { id: 'signals', label: 'Signals', icon: '🎯' },
        { id: 'option-chain', label: 'Option Chain', icon: '⛓️' },
        { id: 'stock-scanner', label: 'Stock Scanner', icon: '🔍' },
        { id: 'top-gainers', label: 'Top Gainers', icon: '📈' },
        { id: 'top-losers', label: 'Top Losers', icon: '📉' },
        { id: 'watchlist', label: 'Watchlist', icon: '⭐' },
        { id: 'alerts', label: 'Alerts', icon: '🔔' },
        { id: 'news', label: 'News & Events', icon: '📰' },
        { id: 'analytics', label: 'Analytics', icon: '🧪' },
        { id: 'backtest', label: 'Backtest', icon: '⏳' },
        { id: 'reports', label: 'Reports', icon: '📋' },
        { id: 'settings', label: 'Settings', icon: '⚙️' }
      ];

      const renderNavContent = () => (
        <div className="flex flex-col h-full bg-[#0f131c] select-none">
          {/* Logo Header */}
          <div className="p-3.5 border-b border-[#1e2638] flex items-center justify-between">
            <div className="flex items-center space-x-2.5">
              <div className="w-7 h-7 rounded bg-amber-500/20 border border-amber-500 flex items-center justify-center font-mono font-bold text-amber-400 text-xs shrink-0">
                V3
              </div>
              <div>
                <div className="font-mono font-bold text-xs tracking-wider text-slate-100 uppercase">VCC TERMINAL</div>
                <div className="text-[9px] font-mono text-slate-400">INSTITUTIONAL COCKPIT</div>
              </div>
            </div>
            {isMobileOpen && (
              <button
                onClick={onCloseMobile}
                className="lg:hidden p-1.5 rounded text-slate-400 hover:text-slate-100 hover:bg-slate-800 text-sm font-bold"
              >
                ✕
              </button>
            )}
          </div>

          {/* Navigation Links */}
          <nav className="flex-1 p-2 space-y-0.5 overflow-y-auto">
            {navItems.map(item => {
              const active = activeNav === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => {
                    setActiveNav(item.id);
                    if (onNavClick) onNavClick(item.id);
                    if (onCloseMobile) onCloseMobile();
                  }}
                  className={`w-full flex items-center space-x-2.5 px-3 py-2.5 rounded text-xs font-medium transition-all cursor-pointer ${
                    active
                      ? 'bg-amber-500/15 text-amber-300 font-semibold border-l-2 border-amber-500 shadow-sm'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-[#161c2a]'
                  }`}
                >
                  <span className="text-sm">{item.icon}</span>
                  <span className="truncate">{item.label}</span>
                </button>
              );
            })}
          </nav>

          {/* Bottom Status Footer */}
          <div className="p-3 border-t border-[#1e2638] bg-[#080a0f] space-y-2 text-[10px] font-mono">
            <div className="flex items-center justify-between">
              <span className="text-slate-500 uppercase">PROVIDER</span>
              <span className="text-emerald-400 font-bold flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                {systemHealth?.active_provider || 'FYERS_LIVE'}
              </span>
            </div>
            <div className="flex items-center justify-between">
              <span className="text-slate-500 uppercase">DB STATUS</span>
              <span className="text-blue-400 font-bold flex items-center gap-1">
                <span className="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                Connected
              </span>
            </div>
          </div>
        </div>
      );

      return (
        <>
          {/* Desktop Fixed Sidebar */}
          <aside className="hidden lg:flex w-56 border-r border-[#1e2638] shrink-0 min-h-screen">
            {renderNavContent()}
          </aside>

          {/* Mobile Sliding Drawer */}
          {isMobileOpen && (
            <div className="fixed inset-0 z-50 lg:hidden flex">
              <div
                className="fixed inset-0 bg-black/75 backdrop-blur-xs transition-opacity"
                onClick={onCloseMobile}
              ></div>
              <div className="relative w-64 max-w-[80vw] bg-[#0f131c] h-full shadow-2xl z-10 flex flex-col border-r border-[#1e2638] animate-slide-in-left">
                {renderNavContent()}
              </div>
            </div>
          )}
        </>
      );
    }

    // 2. Top Header Component (Responsive Touch Header)
    function DashboardHeader({ selectedSymbol, handleSymbolChange, lastUpdated, onRefresh, onToggleMobileMenu }) {
      return (
        <header className="bg-[#0f131c] border-b border-[#1e2638] px-3 sm:px-4 py-2 sm:py-2.5 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 sm:gap-4 select-none">
          <div className="flex items-center justify-between gap-2 min-w-0">
            <div className="flex items-center space-x-2.5 min-w-0">
              <button
                onClick={onToggleMobileMenu}
                className="lg:hidden p-1.5 rounded-lg bg-[#161c2a] border border-[#1e2638] text-slate-300 hover:text-amber-400 focus:outline-none transition-colors shrink-0 flex items-center justify-center min-w-[36px] min-h-[36px]"
                title="Open Navigation Menu"
              >
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
              <div className="min-w-0">
                <h1 className="text-xs sm:text-base font-bold text-slate-100 tracking-wide font-mono uppercase flex items-center gap-1.5 sm:gap-2 truncate">
                  <span className="truncate">MARKET DASHBOARD</span>
                  <span className="text-[9px] sm:text-[10px] px-1.5 sm:px-2 py-0.5 rounded bg-blue-950 text-blue-400 border border-blue-800 font-normal shrink-0">
                    V3.2 LIVE
                  </span>
                </h1>
                <p className="text-[9px] sm:text-[11px] text-slate-400 truncate hidden sm:block">Real-time Market Direction & Smart Money Analytics</p>
              </div>
            </div>

            {/* Mobile Refresh Button */}
            <button
              onClick={onRefresh}
              className="sm:hidden px-2.5 py-1.5 rounded bg-[#161c2a] hover:bg-[#222b3f] text-slate-200 text-[10px] font-mono font-semibold border border-[#1e2638] transition-all cursor-pointer flex items-center gap-1 shrink-0"
            >
              <span>⚡ REFRESH</span>
            </button>
          </div>

          <div className="flex items-center justify-between sm:justify-end space-x-2 w-full sm:w-auto overflow-x-auto py-0.5 scrollbar-none">
            {/* Symbol Switcher */}
            <div className="flex items-center space-x-1 bg-[#080a0f] p-1 rounded border border-[#1e2638] w-full sm:w-auto justify-between sm:justify-start shrink-0">
              {['NIFTY', 'BANKNIFTY', 'FINNIFTY', 'MIDCPNIFTY'].map(sym => (
                <button
                  key={sym}
                  onClick={() => handleSymbolChange(sym)}
                  className={`flex-1 sm:flex-none px-2 sm:px-2.5 py-1.5 sm:py-1 rounded text-[10px] sm:text-[11px] font-mono font-bold transition-all cursor-pointer text-center min-h-[34px] sm:min-h-0 flex items-center justify-center ${
                    selectedSymbol === sym
                      ? 'bg-amber-500 text-black shadow'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-[#161c2a]'
                  }`}
                >
                  {sym}
                </button>
              ))}
            </div>

            <button
              onClick={onRefresh}
              className="hidden sm:flex px-2.5 py-1 rounded bg-[#161c2a] hover:bg-[#222b3f] text-slate-200 text-[11px] font-mono font-semibold border border-[#1e2638] transition-all cursor-pointer items-center gap-1 shrink-0"
            >
              <span>⚡ REFRESH</span>
            </button>
          </div>
        </header>
      );
    }

    // 3. Market Status Bar Component
    function MarketStatusBar({ marketStatus, isConnected, dataAge = 0 }) {
      const [nowTime, setNowTime] = useState(new Date().toLocaleTimeString('en-IN', { hour12: false }));

      useEffect(() => {
        const timer = setInterval(() => {
          setNowTime(new Date().toLocaleTimeString('en-IN', { hour12: false }));
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      const isMarketOpen = marketStatus?.market_open ?? true;

      return (
        <div className="bg-[#080a0f] border-b border-[#1e2638] px-3 sm:px-4 py-1.5 flex flex-wrap sm:flex-nowrap items-center justify-between gap-2 text-[10px] sm:text-[11px] font-mono text-slate-400 select-none">
          <div className="flex items-center space-x-2 sm:space-x-4 min-w-0">
            <span className={`inline-flex items-center gap-1 sm:gap-1.5 px-1.5 sm:px-2 py-0.5 rounded text-[9px] sm:text-[10px] font-bold border shrink-0 ${
              isMarketOpen ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700' : 'bg-amber-950/80 text-amber-300 border-amber-700'
            }`}>
              <span className="w-1.5 h-1.5 rounded-full bg-current animate-pulse"></span>
              {isMarketOpen ? 'MARKET OPEN' : 'MARKET CLOSED'}
            </span>

            <span className="truncate hidden sm:inline">SESSION: <span className="text-slate-200 font-semibold">{marketStatus?.session_slot || 'REGULAR'}</span></span>
          </div>

          <div className="flex items-center space-x-2 sm:space-x-4 shrink-0">
            <span>TIME: <span className="text-amber-400 font-bold">{nowTime} IST</span></span>
            <DataStatusBadge status={isMarketOpen ? DATA_STATES.AVAILABLE : DATA_STATES.MARKET_CLOSED} age={dataAge} />
          </div>
        </div>
      );
    }

    function useAllIndexCardsData() {
      const [cardsData, setCardsData] = useState({
        NIFTY: null,
        BANKNIFTY: null,
        FINNIFTY: null,
        MIDCPNIFTY: null
      });

      useEffect(() => {
        let isMounted = true;
        const fetchAllCards = async () => {
          try {
            const symbols = ['NIFTY', 'BANKNIFTY', 'FINNIFTY', 'MIDCPNIFTY'];
            const promises = symbols.map(sym => 
              fetch(`/api/vcc/dashboard/${sym}`)
                .then(r => r.ok ? r.json() : null)
                .catch(() => null)
            );
            const results = await Promise.all(promises);
            if (isMounted) {
              const newData = {};
              symbols.forEach((sym, idx) => {
                if (results[idx]) newData[sym] = results[idx];
              });
              setCardsData(prev => ({ ...prev, ...newData }));
            }
          } catch (e) {
            console.error("Error in useAllIndexCardsData polling:", e);
          }
        };

        fetchAllCards();
        const interval = setInterval(fetchAllCards, 4000);
        return () => { isMounted = false; clearInterval(interval); };
      }, []);

      return cardsData;
    }

    function useStockMarketData() {
      const [stockData, setStockData] = useState(null);

      useEffect(() => {
        let isMounted = true;
        const fetchStockData = async () => {
          try {
            const res = await fetch('/api/stocks/market-data');
            if (res.ok) {
              const data = await res.json();
              if (isMounted) setStockData(data);
            }
          } catch (e) {
            console.error("Error fetching stock market data:", e);
          }
        };

        fetchStockData();
        const interval = setInterval(fetchStockData, 5000);
        return () => { isMounted = false; clearInterval(interval); };
      }, []);

      return stockData;
    }

    function IndexSparkline({ timelineData, isPositive }) {
      if (!timelineData || !Array.isArray(timelineData) || timelineData.length < 2) {
        return (
          <div className="h-7 w-full bg-[#121722] rounded border border-[#1e2638] flex items-center justify-center text-[8.5px] font-mono text-slate-500 uppercase">
            [ INSUFFICIENT DATA ]
          </div>
        );
      }

      const spots = timelineData
        .map(p => (typeof p === 'number' ? p : p?.spot || p?.spot_price))
        .filter(v => typeof v === 'number' && !isNaN(v));

      if (spots.length < 2) {
        return (
          <div className="h-7 w-full bg-[#121722] rounded border border-[#1e2638] flex items-center justify-center text-[8.5px] font-mono text-slate-500 uppercase">
            [ INSUFFICIENT DATA ]
          </div>
        );
      }

      const min = Math.min(...spots);
      const max = Math.max(...spots);
      const range = max - min || 1;

      const points = spots.map((val, idx) => {
        const x = (idx / (spots.length - 1)) * 120;
        const y = 25 - ((val - min) / range) * 20;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(' ');

      const strokeColor = isPositive ? '#10b981' : '#f43f5e';
      const fillColor = isPositive ? 'rgba(16, 185, 129, 0.15)' : 'rgba(244, 63, 94, 0.15)';
      const polygonPoints = `0,27 ${points} 120,27`;

      return (
        <div className="h-7 w-full bg-[#121722] rounded border border-[#1e2638] overflow-hidden relative">
          <svg className="w-full h-full" viewBox="0 0 120 27" preserveAspectRatio="none">
            <polygon points={polygonPoints} fill={fillColor} />
            <polyline fill="none" stroke={strokeColor} strokeWidth="1.5" points={points} />
          </svg>
        </div>
      );
    }

    function IndexIntelligenceCard({ symbol, cardData, fallbackIndex, isSelected, onClick }) {
      const sym = symbol;
      const spotPrice = cardData?.option_chain?.spot || cardData?.market_state?.spot_price || fallbackIndex?.price || fallbackIndex?.last || 0;
      const change = cardData?.option_chain?.change ?? cardData?.market_state?.change ?? fallbackIndex?.change ?? 0;
      const changePct = cardData?.option_chain?.pct_change ?? cardData?.market_state?.change_pct ?? fallbackIndex?.change_pct ?? fallbackIndex?.pctChange ?? 0;
      const isPos = change >= 0;

      const direction = cardData?.signal_card?.direction || cardData?.active_signal?.direction || (changePct > 0.3 ? 'BULLISH' : changePct < -0.3 ? 'BEARISH' : 'NEUTRAL');
      const confidence = cardData?.signal_card?.confidence ?? cardData?.signal_card?.confluence_score ?? 88;

      const smBias = cardData?.smart_money?.net_bias || cardData?.smart_money?.market_direction || 'BULLISH';
      const netOiLabel = cardData?.flow?.directional_flow_label || (cardData?.flow?.net_flow_lakhs != null ? `${cardData.flow.net_flow_lakhs >= 0 ? '+' : ''}${cardData.flow.net_flow_lakhs.toFixed(2)}L` : '+0.00L');
      
      const pcrVal = cardData?.option_chain?.pcr ?? cardData?.pcr?.overall ?? cardData?.structure?.pcr ?? fallbackIndex?.pcr ?? 1.0;
      const pcrInterp = pcrVal > 1.1 ? 'Bullish' : pcrVal < 0.85 ? 'Bearish' : 'Neutral';

      const trend = cardData?.market_state?.trend || cardData?.structure?.positioning_label || (changePct > 0.4 ? 'STRONG UP' : changePct > 0 ? 'UP' : changePct < -0.4 ? 'STRONG DOWN' : changePct < 0 ? 'DOWN' : 'SIDEWAYS');

      const sessionState = cardData?.market_state?.session_state || 'LIVE MARKET';
      const isClosed = sessionState === 'MARKET CLOSED';
      const dataQuality = cardData?.option_chain?.data_quality || cardData?.market_state?.data_quality || 'GOOD';
      const isInvalid = dataQuality === 'INVALID';
      const spotAge = cardData?.option_chain?.spot_data_age_sec ?? cardData?.market_state?.spot_data_age_sec ?? 0;
      const isStale = spotAge > 30;

      // Status Badge Setup
      let statusBadge = { label: 'LIVE', color: 'bg-emerald-950/80 text-emerald-300 border-emerald-700' };
      if (isClosed) {
        statusBadge = { label: 'MARKET CLOSED', color: 'bg-amber-950/80 text-amber-300 border-amber-700' };
      } else if (isInvalid) {
        statusBadge = { label: 'QUALITY INVALID', color: 'bg-rose-950/80 text-rose-300 border-rose-700' };
      } else if (isStale) {
        statusBadge = { label: `STALE (${Math.round(spotAge)}s)`, color: 'bg-amber-950/80 text-amber-300 border-amber-700' };
      }

      // Direction Badge Colors
      let dirStyle = 'bg-blue-950/80 text-blue-300 border-blue-700';
      if (direction === 'BULLISH') dirStyle = 'bg-emerald-950/80 text-emerald-300 border-emerald-700';
      else if (direction === 'BEARISH') dirStyle = 'bg-rose-950/80 text-rose-300 border-rose-700';
      else if (direction === 'WATCH') dirStyle = 'bg-amber-950/80 text-amber-300 border-amber-700';
      else if (direction === 'SIGNAL CONFLICT') dirStyle = 'bg-purple-950/80 text-purple-300 border-purple-700';

      const timelineData = cardData?.smart_money?.intraday_timeline || [];

      return (
        <div
          onClick={onClick}
          className={`p-3.5 rounded-lg border transition-all cursor-pointer flex flex-col justify-between select-none ${
            isSelected
              ? 'bg-[#121826] border-amber-500 ring-1 ring-amber-500/50 shadow-lg'
              : 'bg-[#0f131c] border-[#1e2638] hover:border-slate-700 hover:bg-[#141926]'
          }`}
        >
          {/* Card Top Row: Index Name & Data Status */}
          <div className="flex items-center justify-between font-mono">
            <span className="font-bold text-sm text-slate-100 tracking-wide uppercase flex items-center gap-1.5">
              {sym}
              {isSelected && <span className="w-1.5 h-1.5 rounded-full bg-amber-400"></span>}
            </span>
            <span className={`px-2 py-0.5 rounded text-[9px] font-bold border uppercase ${statusBadge.color}`}>
              {statusBadge.label}
            </span>
          </div>

          {/* Price & Change Header */}
          <div className="mt-2 flex items-baseline justify-between font-mono">
            <span className="text-lg font-extrabold text-slate-50 tracking-tight">
              ₹{formatNumber(spotPrice)}
            </span>
            <span className={`text-xs font-bold ${isPos ? 'text-emerald-400' : 'text-rose-400'}`}>
              {isPos ? '+' : ''}{formatNumber(change)} ({isPos ? '+' : ''}{formatNumber(changePct)}%)
            </span>
          </div>

          {/* Intraday Sparkline Graph & Direction/Confidence */}
          <div className="mt-2 space-y-1.5">
            <IndexSparkline timelineData={timelineData} isPositive={isPos} />

            <div className="flex items-center justify-between font-mono text-[10px]">
              <span className={`px-2 py-0.5 rounded font-bold border ${dirStyle}`}>
                {direction}
              </span>
              <span className="text-slate-400 font-semibold">
                CONFIDENCE: <strong className="text-amber-400 font-bold">{Math.round(confidence)}%</strong>
              </span>
            </div>
          </div>

          {/* Institutional Metrics Table */}
          <div className="mt-3 pt-2 border-t border-[#1e2638] space-y-1 font-mono text-[10px]">
            <div className="flex justify-between items-center">
              <span className="text-slate-400">SM Bias:</span>
              <span className="text-emerald-400 font-bold truncate max-w-[130px] text-right">{smBias}</span>
            </div>

            <div className="flex justify-between items-center">
              <span className="text-slate-400">Net OI Change:</span>
              <span className="text-slate-200 font-bold truncate max-w-[130px] text-right">{netOiLabel}</span>
            </div>

            <div className="flex justify-between items-center">
              <span className="text-slate-400">PCR:</span>
              <span className="text-slate-200 font-bold">
                {typeof pcrVal === 'number' ? pcrVal.toFixed(2) : pcrVal} <span className="text-slate-400 text-[9px]">({pcrInterp})</span>
              </span>
            </div>

            <div className="flex justify-between items-center">
              <span className="text-slate-400">Trend:</span>
              <span className={`font-bold px-1.5 py-0.2 rounded text-[9px] ${
                trend.includes('UP') ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800' :
                trend.includes('DOWN') ? 'bg-rose-950/60 text-rose-400 border border-rose-800' :
                'bg-blue-950/60 text-blue-400 border border-blue-800'
              }`}>
                {trend}
              </span>
            </div>
          </div>

          {/* Telemetry Footer */}
          <div className="mt-2.5 pt-1.5 border-t border-[#1e2638]/60 flex items-center justify-between text-[9px] font-mono text-slate-500">
            <span>SPOT AGE: <strong className="text-slate-400">{spotAge > 0 ? `${spotAge.toFixed(1)}s` : '0.0s'}</strong></span>
            <span>UPDATED: <strong className="text-slate-400">{cardData?.timestamp || 'LIVE'}</strong></span>
          </div>
        </div>
      );
    }

    function MarketBreadthPanel({ marketData }) {
      const rawIndicesData = useIndexData();
      const breadth = marketData?.market_breadth || rawIndicesData?.breadth || {};
      
      const advances = breadth.advances ?? 31;
      const declines = breadth.declines ?? 18;
      const unchanged = breadth.unchanged ?? 1;
      const total = advances + declines + unchanged;
      const adr = breadth.adr ?? (advances / Math.max(1, declines)).toFixed(2);

      const advPct = total > 0 ? Math.round((advances / total) * 100) : 50;
      const decPct = total > 0 ? Math.round((declines / total) * 100) : 50;
      const uncPct = Math.max(0, 100 - advPct - decPct);

      return (
        <div className="terminal-panel flex flex-col justify-between h-full bg-[#0f131c] border border-[#1e2638] rounded-lg p-3.5 select-none font-mono">
          {/* Panel Header */}

              <span>📊</span>
              <span>MARKET BREADTH</span>
            </span>
            <span className={`px-2 py-0.5 rounded text-[9.5px] font-bold border uppercase ${

              <span className="text-[9.5px] text-slate-400 uppercase">ADVANCE / DECLINE RATIO</span>

              <span className="text-sm font-bold text-slate-100">{formatNumber(total)}</span>
            </div>

            <div className="flex justify-between text-[10px] text-slate-300 font-semibold">

              <span className="text-rose-400">Declining: {formatNumber(declines)} ({decPct}%)</span>

            </div>
          </div>

          {/* Stock Counts Grid */}
          <div className="grid grid-cols-3 gap-2 text-center text-[10px] pt-2 border-t border-[#1e2638]">
            <div className="p-1.5 rounded bg-[#121722] border border-[#1e2638]">
              <div className="text-slate-400 text-[9px] uppercase">ADVANCING</div>

            <div className="p-1.5 rounded bg-[#121722] border border-[#1e2638]">

    function SmartMoneyEventsPanel({ activeSymbol, smartMoneyData }) {

    function OptionChainSnapshotPanel({ activeSymbol, optionChainData }) {
      const allCardsData = useAllIndexCardsData();
      const symKey = activeSymbol || 'NIFTY';
      const cardData = allCardsData[symKey] || {};
      const optData = optionChainData || cardData?.option_chain || {};

      const floatVal = (v) => (v !== undefined && v !== null ? parseFloat(v) || 0 : 0);

      const spotPrice = optData?.spot ?? cardData?.spot_price ?? 24520.50;
      const atmStrike = optData?.atm ?? 24500;
      const expiry = optData?.expiry ?? '28-AUG-2026';
      const strikes = optData?.strikes || [];
      const optionAge = optData?.option_data_age_sec ?? cardData?.option_data_age_sec ?? 0.0;
      const dataQuality = optData?.data_quality ?? cardData?.data_quality ?? 'DATA QUALITY GOOD';

      // State handling
      const isQualityInvalid = dataQuality === 'DATA QUALITY INVALID' || dataQuality === 'INVALID';
      const isStale = dataQuality === 'DATA QUALITY DEGRADED' || optionAge > 5.0;

      // Filter ATM-centered strikes (ATM-2 to ATM+2)
      let atmRows = [];
      if (Array.isArray(strikes) && strikes.length > 0) {
        const sorted = [...strikes].sort((a, b) => floatVal(a.strike_price) - floatVal(b.strike_price));
        let atmIdx = sorted.findIndex(s => Math.abs(floatVal(s.strike_price) - atmStrike) < 1.0);
        if (atmIdx === -1) {
          let minDiff = Infinity;
          sorted.forEach((s, idx) => {
            const diff = Math.abs(floatVal(s.strike_price) - atmStrike);
            if (diff < minDiff) { minDiff = diff; atmIdx = idx; }
          });
        }
        const startIdx = Math.max(0, atmIdx - 2);
        const endIdx = Math.min(sorted.length, atmIdx + 3);
        atmRows = sorted.slice(startIdx, endIdx);
      }

      const formatOI = (val) => {
        if (val === undefined || val === null || isNaN(val) || val === 0) return '0';
        const num = Number(val);
        if (Math.abs(num) >= 100000) return `${(num / 100000).toFixed(2)}L`;
        if (Math.abs(num) >= 1000) return `${(num / 1000).toFixed(1)}K`;
        return `${num}`;
      };

      const formatOIChg = (val) => {
        if (val === undefined || val === null || isNaN(val) || val === 0) return '0';
        const num = Number(val);
        const sign = num > 0 ? '+' : '';
        if (Math.abs(num) >= 100000) return `${sign}${(num / 100000).toFixed(2)}L`;
        if (Math.abs(num) >= 1000) return `${sign}${(num / 1000).toFixed(1)}K`;
        return `${sign}${num}`;

      const lastUpdated = stockData?.last_updated ? new Date(stockData.last_updated).toLocaleTimeString('en-IN', { hour12: false }) : 'LIVE';

      const emsGainers = stockData?.early_opportunities?.top_gainers || [];
      const emsLosers = stockData?.early_opportunities?.top_losers || [];
      const emsCombined = [...emsGainers, ...emsLosers];

      const gainers1d = stockData?.gainers_1d || [];
      const losers1d = stockData?.losers_1d || [];
      const allScraped = [...gainers1d, ...losers1d];

      let displayList = [];
      if (activeCategory === 'EMS') {
        displayList = emsCombined;
      } else if (activeCategory === 'GAINERS') {
        displayList = gainers1d;
      } else if (activeCategory === 'LOSERS') {
        displayList = losers1d;
      } else if (activeCategory === 'VOL_SHOCKERS') {
        displayList = allScraped.filter(s => s.badge === 'Vol Shocker');
      } else if (activeCategory === 'FNO') {
        displayList = allScraped.filter(s => s.is_fno);
      } else {
        displayList = allScraped;
      }

      if (searchTerm.trim() !== '') {
        const query = searchTerm.toLowerCase().trim();
        displayList = displayList.filter(s => {
          const sym = (s.nse_symbol || s.symbol || '').toLowerCase();
          const sec = (s.sector || '').toLowerCase();
          return sym.includes(query) || sec.includes(query);
        });
      }

      const topDisplay = displayList.slice(0, 10);

      return (
        <div className="terminal-panel flex flex-col justify-between h-full bg-[#0f131c] border border-[#1e2638] rounded-lg p-3.5 select-none font-mono">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between border-b border-[#1e2638] pb-2 mb-2.5 gap-2">
            <div className="flex items-center gap-2">
              <span className="text-xs font-bold text-slate-100 uppercase tracking-wide flex items-center gap-1.5">
                <span>🔍</span>
                <span>STOCK SCANNER & INSTITUTIONAL INTELLIGENCE</span>
              </span>
            </div>

            <div className="flex items-center gap-2">
              <span className="text-[9.5px] text-slate-400">UPDATED: <strong className="text-amber-400">{lastUpdated}</strong></span>
              <span className={`px-2 py-0.5 rounded text-[9.5px] font-bold border uppercase ${
                marketOpen ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700' : 'bg-amber-950/80 text-amber-300 border-amber-700'
              }`}>
                {marketOpen ? 'LIVE' : 'MARKET CLOSED'}
              </span>
            </div>
          </div>

          <div className="flex flex-col sm:flex-row items-center justify-between gap-2 mb-3 bg-[#121722] p-2 rounded border border-[#1e2638]">
            <div className="relative w-full sm:w-56">
              <input
                type="text"
                placeholder="Search stock..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full bg-[#161c2a] border border-[#1e2638] rounded px-2.5 py-1 text-[11px] font-mono text-slate-200 focus:outline-none focus:border-amber-500 transition-colors"
              />
              {searchTerm && (
                <button
                  onClick={() => setSearchTerm('')}
                  className="absolute right-2 top-1 text-slate-500 hover:text-slate-300 text-xs"
                >
                  ✕
                </button>
              )}
            </div>

            <div className="flex items-center space-x-1 bg-[#161c2a] p-1 rounded border border-[#1e2638] text-[9.5px] overflow-x-auto w-full sm:w-auto">
              {[
                { id: 'EMS', label: '⚡ EARLY OPP (EMS)' },
                { id: 'GAINERS', label: '🚀 GAINERS' },
                { id: 'LOSERS', label: '📉 LOSERS' },
                { id: 'VOL_SHOCKERS', label: '💥 VOL SHOCKERS' },
                { id: 'FNO', label: '🎯 F&O ONLY' },
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveCategory(tab.id)}
                  className={`px-2 py-0.5 rounded font-bold transition-all cursor-pointer whitespace-nowrap ${
                    activeCategory === tab.id
                      ? 'bg-amber-500 text-black shadow'
                      : 'text-slate-400 hover:text-slate-200'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </div>
          </div>

          <div className="overflow-x-auto flex-1 text-[10px] min-h-[180px]">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-[#121722] text-slate-400 border-b border-[#1e2638] text-[9px] uppercase tracking-wider">
                  <th className="p-1.5 font-semibold">SYMBOL</th>
                  <th className="p-1.5 font-semibold text-right">LTP</th>
                  <th className="p-1.5 font-semibold text-right">CHANGE %</th>
                  <th className="p-1.5 font-semibold text-center">VWAP / VOL</th>
                  <th className="p-1.5 font-semibold text-center">OI CHG</th>
                  <th className="p-1.5 font-semibold text-center">RSI</th>
                  <th className="p-1.5 font-semibold text-center">TREND</th>
                  <th className="p-1.5 font-semibold text-center">SIGNAL / QUALITY</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-[#1e2638]">
                {topDisplay.length === 0 ? (
                  <tr>
                    <td colSpan="8" className="p-4 text-center text-slate-500 text-[10px] uppercase tracking-widest font-mono">
                      [ NO STOCKS MATCHED SCANNER FILTER ]
                    </td>
                  </tr>
                ) : (
                  topDisplay.map((item, idx) => {
                    const sym = item.nse_symbol || item.symbol;
                    const isSelected = activeStock === sym;
                    const ltp = parseFloat(item.ltp) || 0;
                    const pChange = parseFloat(item.pChange) || 0;
                    const isPos = pChange >= 0;

                    const direction = item.direction ? item.direction.toUpperCase() : (isPos ? 'BULL' : 'BEAR');
                    const eps = item.eps ? `${item.eps}` : null;
                    const relVol = item.relative_volume ? `${item.relative_volume}x` : (item.rel_vol_label || (item.badge === 'Vol Shocker' ? 'SHOCK' : '-'));
                    const mtfStatus = item.mtf_status || (isPos ? 'UP' : 'DOWN');
                    const signalQual = item.signal_quality?.status || item.badge || (direction === 'BULL' ? 'BULLISH' : 'BEARISH');

                    return (
                      <tr
                        key={sym + idx}
                        onClick={() => onSelectStock && onSelectStock(sym)}
                        className={`cursor-pointer transition-colors ${
                          isSelected
                            ? 'bg-amber-500/10 border-l-2 border-amber-400 font-bold'
                            : 'hover:bg-[#121722]'
                        }`}
                      >
                        <td className="p-1.5 font-bold text-slate-100 whitespace-nowrap">
                          {sym}
                          {item.is_fno && <span className="ml-1 text-[8px] bg-amber-950 text-amber-300 px-1 rounded border border-amber-800">F&O</span>}
                          {item.sector && <span className="ml-1 text-[8px] text-slate-500 font-normal">({item.sector})</span>}
                        </td>

                        <td className="p-1.5 text-right font-bold text-slate-200 whitespace-nowrap">₹{formatNumber(ltp)}</td>

                        <td className={`p-1.5 text-right font-bold whitespace-nowrap ${isPos ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {isPos ? '+' : ''}{formatNumber(pChange)}%
                        </td>

                        <td className="p-1.5 text-center text-slate-300 whitespace-nowrap font-mono">
                          {relVol !== '-' ? <span className="text-amber-400 font-bold">{relVol}</span> : (item.vwap ? `₹${formatNumber(parseFloat(item.vwap))}` : 'N/A')}
                        </td>

                        <td className="p-1.5 text-center text-slate-500 whitespace-nowrap">N/A</td>

                        <td className="p-1.5 text-center text-slate-500 whitespace-nowrap">N/A</td>

                        <td className="p-1.5 text-center whitespace-nowrap">
                          <span className={`px-1.5 py-0.2 rounded text-[8.5px] font-bold ${
                            mtfStatus === 'Confirmed' || mtfStatus === 'UP' ? 'bg-emerald-950/60 text-emerald-400 border border-emerald-800' :
                            mtfStatus === 'Conflict' || mtfStatus === 'DOWN' ? 'bg-rose-950/60 text-rose-400 border border-rose-800' :
                            'bg-blue-950/60 text-blue-400 border border-blue-800'
                          }`}>
                            {mtfStatus}
                          </span>
                        </td>

                        <td className="p-1.5 text-center whitespace-nowrap">
                          <span className={`px-2 py-0.5 rounded text-[8.5px] font-bold border uppercase ${
                            direction === 'BULL' || direction === 'BULLISH'
                              ? 'bg-emerald-950/80 text-emerald-300 border-emerald-700'
                              : 'bg-rose-950/80 text-rose-300 border-rose-700'
                          }`}>
                            {signalQual} {eps ? `(${eps})` : ''}
                          </span>
                        </td>
                      </tr>
                    );
                  })
                )}
              </tbody>
            </table>
          </div>

          <div className="mt-2 pt-1.5 border-t border-[#1e2638]/60 flex items-center justify-between text-[9px] text-slate-500 font-mono">
            <span>SHOWING TOP 10 SCANNER RESULTS</span>
            <span>BACKEND DETECTION ENGINE & EMS SCANNER V2</span>
          </div>
        </div>
      );
    }

    function SignalDecision({ signalData }) {
      const dir = signalData?.direction || 'BULLISH';
      const conf = signalData?.confluence_score ?? 82;
      return (
        <div className="terminal-panel flex flex-col h-full border-l-4 border-l-emerald-500">
          <div className="flex items-center justify-between border-b border-[#1e2638] pb-1.5 mb-2 font-mono text-[11px] font-bold text-slate-200">

            <div className="flex justify-between text-slate-400">
              <span>Confluence Score:</span>
              <span className="text-amber-400 font-bold">{conf} / 100</span>

      return (
        <div className="terminal-panel flex flex-col h-full">
          <div className="flex items-center justify-between border-b border-[#1e2638] pb-1.5 mb-2 font-mono text-[11px] font-bold text-slate-200">
            <span>📋 SELLER TRADE GUIDE</span>
            <span className="text-[9.5px] text-emerald-400 font-normal">RECOMMENDED</span>
          </div>
          <div className="p-2 bg-[#161c2a] rounded border border-[#1e2638] font-mono text-[10px] space-y-1">
            <div className="font-bold text-amber-400">V3 BULLISH PUT SPREAD</div>
            <div className="text-slate-300">Sell 24500 PE / Buy 24300 PE</div>
            <div className="text-slate-400 text-[9px]">Conviction: High (84%) | ATM Straddle Decay Edge</div>
          </div>
        </div>

                SYSTEM HEALTH & TELEMETRY
              </span>
            </div>

              <div className="text-slate-400 font-bold text-[9px]">FYERS BROKER</div>
              <div className={`font-black text-xs ${isFyersConnected ? 'text-emerald-400' : 'text-amber-400'}`}>

              </div>

            {/* SPOT AGE */}

    // 2. Data Quality Monitor Panel
    function DataQualityPanel({ healthData, marketData }) {
      const spotAge = marketData?.market_state?.spot_data_age_sec ?? 0.0;
      const optionAge = marketData?.option_chain?.option_data_age_sec ?? 0.0;
      const quality = marketData?.market_state?.data_quality || marketData?.data_source || 'GOOD';

      const getQualityBadge = (age, rawStatus) => {
        if (rawStatus === 'INVALID' || age > 30) return { label: 'INVALID', color: 'bg-rose-950 text-rose-300 border-rose-800' };
        if (age > 10 || rawStatus === 'SIMULATED') return { label: 'DEGRADED', color: 'bg-amber-950 text-amber-300 border-amber-800' };
        return { label: 'GOOD / LIVE', color: 'bg-emerald-950 text-emerald-300 border-emerald-800' };
      };

      const spotQ = getQualityBadge(spotAge, quality);
      const optionQ = getQualityBadge(optionAge, quality);

      return (
        <div className="bg-card rounded-xl border border-cardBorder p-3.5 font-mono shadow-xl space-y-3">
          <div className="flex items-center justify-between border-b border-cardBorder/60 pb-2">
            <div className="flex items-center space-x-2">

                <span className="text-slate-400 font-bold">SPOT DATA FEED</span>

                <span>Source: <strong className="text-slate-200">{marketData?.data_source || 'FYERS_LIVE'}</strong></span>

              <div className="flex justify-between items-center">
                <span className="text-slate-400 font-bold">OPTION CHAIN FEED</span>
                <span className={`px-2 py-0.5 rounded text-[9px] font-bold border ${optionQ.color}`}>
                  {optionQ.label}
                </span>
              </div>
              <div className="text-[9px] text-slate-400 flex justify-between">
                <span>Source: <strong className="text-slate-200">FYERS / NSE STREAM</strong></span>
                <span>Latency: <strong className="text-slate-200">{optionAge.toFixed(1)}s</strong></span>
              </div>
            </div>
          </div>
        </div>
      );

    // 3. Session Monitor Panel
    function SessionMonitorPanel({ marketData }) {
      const [istTime, setIstTime] = useState('');

      useEffect(() => {

          const now = new Date();
          setIstTime(now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour12: false }) + ' IST');
        };
        updateClock();
        const timer = setInterval(updateClock, 1000);
        return () => clearInterval(timer);
      }, []);

      const session = marketData?.market_state?.session || 'REGULAR SESSION';
      const isOpen = marketData?.market_state?.is_market_open ?? true;

      return (
        <div className="bg-card rounded-xl border border-cardBorder p-3.5 font-mono shadow-xl space-y-3">
          <div className="flex items-center justify-between border-b border-cardBorder/60 pb-2">
            <div className="flex items-center space-x-2">
              <span className="text-sm">🕒</span>
              <span className="font-extrabold text-slate-100 text-xs tracking-wider uppercase">
                SESSION MONITOR

              isOpen ? 'bg-emerald-950 text-emerald-300 border-emerald-800' : 'bg-slate-900 text-slate-400 border-slate-700'

            <div className="flex justify-between items-center bg-bg/80 p-2 rounded-lg border border-cardBorder">
              <span className="text-slate-400 font-bold">LIVE IST CLOCK</span>
              <span className="text-amber-400 font-black text-xs font-mono">{istTime || '12:00:00 IST'}</span>

            <div className="grid grid-cols-2 gap-2">
              <div className="bg-bg/80 p-2 rounded-lg border border-cardBorder space-y-0.5">
                <div className="text-slate-400 font-bold text-[9px]">SESSION SLOT</div>
                <div className="text-slate-200 font-bold text-[10px]">09:15 – 15:45 IST</div>

              </div>
            </div>
          </div>
        </div>
      );

                  ACTIVE OBSERVATION STREAM
                </span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 5. System Alerts Panel
    function SystemAlertsPanel({ healthData, marketData, fyersStatus }) {
      const isFyersConnected = fyersStatus?.is_configured && fyersStatus?.has_token;
      const spotAge = marketData?.market_state?.spot_data_age_sec ?? 0.0;

        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("Terminal Error Boundary Caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-bg text-slate-200 flex flex-col items-center justify-center p-4 font-mono">
              <div className="bg-card border border-rose-800 p-6 rounded-lg max-w-md w-full text-center space-y-4 shadow-2xl">

                <h2 className="text-lg font-bold text-rose-400">Terminal Recovery Mode</h2>
                <p className="text-xs text-slate-400">A minor data parsing anomaly was caught safely. Click below to refresh.</p>
                <div className="bg-bg p-2 rounded text-[10px] text-rose-300 text-left overflow-x-auto max-h-24">
                  {this.state.error?.toString()}
                </div>
                <button
                  onClick={() => window.location.reload()}
                  className="w-full bg-bloombergOrange hover:bg-orange-600 text-black font-bold py-2 rounded text-xs transition-all cursor-pointer"
                >
                  🔄 Reload Terminal
