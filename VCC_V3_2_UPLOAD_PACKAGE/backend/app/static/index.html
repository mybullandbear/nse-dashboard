                <div className="flex items-center space-x-3 text-[10px]">
                  <div>
                    <span className="text-slate-400">PE FLOW: </span>
                    <span className="text-emerald-400 font-bold">+{flowEng.pe_flow_lakhs}L</span>
                  </div>
                  <div>
                    <span className="text-slate-400">CE FLOW: </span>
                    <span className="text-emerald-400 font-bold">+{flowEng.ce_flow_lakhs}L</span>
                  </div>
                </div>
              </div>

              {/* Triple-Line Graph SVG */}
              <div className="h-28 w-full bg-slate-950 rounded border border-cardBorder p-1.5 relative overflow-hidden">
                <svg className="w-full h-full" viewBox="0 0 300 90" preserveAspectRatio="none">
                  <line x1="0" y1="45" x2="300" y2="45" stroke="#1e2638" strokeDasharray="3" />
                  <polyline fill="none" stroke="#10b981" strokeWidth="2" points="0,65 50,50 100,55 150,30 200,35 250,20 300,15" />
                  <polyline fill="none" stroke="#ef4444" strokeWidth="2" points="0,40 50,45 100,42 150,55 200,60 250,68 300,75" />
                  <polyline fill="none" stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="3,3" points="0,52 50,48 100,49 150,42 200,48 250,44 300,38" />
                </svg>
                <div className="flex justify-between text-[8px] text-slate-500 font-mono mt-0.5">
                  <span>09:15</span>
                  <span>10:00</span>
                  <span>11:00</span>
                  <span>12:00</span>
                  <span>13:00</span>
                  <span>14:00</span>
                  <span>15:00</span>
                </div>
              </div>

              {/* Flow Legend */}
              <div className="flex items-center justify-around text-[9px] font-bold pt-1">
                <span className="text-emerald-400 flex items-center space-x-1">
                  <span className="w-2 h-0.5 bg-emerald-400 inline-block"></span>
                  <span>PE FLOW</span>
                </span>
                <span className="text-rose-400 flex items-center space-x-1">
                  <span className="w-2 h-0.5 bg-rose-400 inline-block"></span>
                  <span>CE FLOW</span>
                </span>
                <span className="text-amber-400 flex items-center space-x-1">
                  <span className="w-2 h-0.5 bg-amber-400 border-b border-dashed inline-block"></span>
                  <span>NET FLOW</span>
                </span>
              </div>
            </div>

            {/* 1C. MARKET REGIME ENGINE */}
            <div className="col-span-12 md:col-span-4 bg-card rounded-lg border border-cardBorder p-3 shadow-xl flex flex-col justify-between">
              <div className="flex items-center justify-between border-b border-cardBorder/60 pb-1.5">
                <span className="text-[11px] font-bold uppercase tracking-wider text-slate-200">
                  MARKET REGIME
                </span>
                <span className={`font-bold text-xs ${confluence.is_conflict ? 'text-amber-400' : 'text-emerald-400'}`}>
                  {confluence.is_conflict ? 'SIGNAL CONFLICT' : confluence.label}
                </span>
              </div>

              {/* Metadata Grid */}
              <div className="grid grid-cols-2 gap-x-2 gap-y-1 text-[9.5px] font-mono my-1 bg-slate-950 p-2 rounded border border-cardBorder">
                <div><span className="text-slate-400">REGIME STARTED:</span> <span className="text-slate-200 font-bold">{sigMeta.started_time}</span></div>
                <div><span className="text-slate-400">DURATION:</span> <span className="text-slate-200 font-bold">{sigMeta.age_formatted}</span></div>
                <div><span className="text-slate-400">PERSISTENCE:</span> <span className="text-cyan-400 font-bold">{sigMeta.persistence}%</span></div>
                <div><span className="text-slate-400">RELIABILITY:</span> <span className="text-emerald-400 font-bold">{sigMeta.reliability}%</span></div>
              </div>

              {/* Regime Timeline Log */}
              <div className="space-y-0.5 text-[9px] font-mono bg-bg p-1.5 rounded border border-cardBorder">
                <div className="text-slate-400 font-bold text-[8.5px] uppercase mb-0.5">REGIME TIMELINE:</div>
                <div className="flex justify-between text-slate-400"><span>09:15</span> <span>RANGE COMPRESSION</span></div>
                <div className="flex justify-between text-slate-400"><span>10:24</span> <span>BREAKOUT PREPARATION</span></div>
                <div className="flex justify-between text-emerald-400 font-bold"><span>{sigMeta.started_time}</span> <span>{confluence.label}</span></div>
                <div className="flex justify-between text-emerald-300 font-bold bg-emerald-950/60 px-1 rounded border border-emerald-700/60">
                  <span>CURRENT</span> <span>{confluence.label}</span>
                </div>
              </div>
            </div>

          </div>


          {/* SECTION 2: TELEMETRY STRIP (5 CARDS) */}
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2 text-mono">
            {/* SPOT */}
            <div className="bg-card p-2 rounded border border-cardBorder shadow">
              <div className="text-[9px] text-slate-400 font-bold flex justify-between">
                <span>SPOT</span>
                <span className={`font-bold ${priceConf.spot_chg_open_pct >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {priceConf.spot_chg_open_pct >= 0 ? '+' : ''}{priceConf.spot_chg_open_pct}%
                </span>
              </div>
              <div className="text-base font-extrabold text-white mt-0.5">{spotPrice.toLocaleString('en-IN', { minimumFractionDigits: 2 })}</div>
            </div>

            {/* PCR (5M) */}
            <div className="bg-card p-2 rounded border border-cardBorder shadow">
              <div className="text-[9px] text-slate-400 font-bold flex justify-between">
                <span>PCR (CURRENT)</span>
                <span className="text-emerald-400 font-bold">{pcrAnalytics.current}</span>
              </div>
              <div className="text-base font-extrabold text-white mt-0.5">{pcrAnalytics.current}</div>
              <div className="text-[8.5px] text-slate-400">5M: {pcrAnalytics['5m_ago']} | 15M: {pcrAnalytics['15m_ago']}</div>
            </div>

            {/* ATM STRADDLE */}
            <div className="bg-card p-2 rounded border border-cardBorder shadow">
              <div className="text-[9px] text-slate-400 font-bold flex justify-between">
                <span>ATM STRADDLE</span>
                <span className="text-rose-400 font-bold">-8.7%</span>
              </div>
              <div className="text-base font-extrabold text-white mt-0.5">₹264.35</div>
              <div className="text-[8.5px] text-slate-400">15M: -8.7% | OPEN: -15.4%</div>
            </div>

            {/* EXPECTED RANGE */}
            <div className="bg-card p-2 rounded border border-cardBorder shadow">
              <div className="text-[9px] text-slate-400 font-bold">WALL RANGE WIDTH</div>
              <div className="text-sm font-extrabold text-amber-300 mt-0.5">
                {wallRange.strongest_pe.toLocaleString()} - {wallRange.strongest_ce.toLocaleString()}
              </div>
              <div className="text-[8.5px] text-slate-400">WIDTH: {wallRange.current_width_pts} PTS ({wallRange.status})</div>
            </div>

            {/* DATA STATUS */}
            <div className="bg-card p-2 rounded border border-cardBorder shadow col-span-2 sm:col-span-1">
              <div className="text-[9px] text-slate-400 font-bold flex justify-between">

      const [telegramChatId, setTelegramChatId] = useState(() => localStorage.getItem('tg_chat_id') || '');
      const [telegramMsg, setTelegramMsg] = useState(null);
      const [isSendingTgTest, setIsSendingTgTest] = useState(false);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [toasts, setToasts] = useState([]);
      const [pushPermission, setPushPermission] = useState('default');

      // Web Audio API Synthesizer for 100% Reliable Chimes
      const playChime = (type = 'BULL') => {
        try {
          if (!soundEnabled) return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);

          const now = ctx.currentTime;
          if (type === 'BULL') {
            osc.frequency.setValueAtTime(587.33, now); // D5
            osc.frequency.exponentialRampToValueAtTime(1174.66, now + 0.15); // D6
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          } else if (type === 'BEAR') {
            osc.frequency.setValueAtTime(880, now); // A5
            osc.frequency.exponentialRampToValueAtTime(440, now + 0.15); // A4
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
          } else {
            osc.frequency.setValueAtTime(1760, now); // A6 blip
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
          }
          osc.start(now);
          osc.stop(now + 0.35);
        } catch (e) {
          console.warn("Audio Context playback:", e);
        }
      };

      const triggerPushAlert = (title, body, type = 'BULL') => {
        playChime(type);
        if (typeof navigator !== 'undefined' && navigator.vibrate) {
          try { navigator.vibrate([120, 60, 120]); } catch(e){}
        }
        const newToast = { id: Date.now(), title, body, type, time: new Date().toLocaleTimeString() };
        setToasts(prev => [newToast, ...prev.slice(0, 2)]);

        try {
          if (typeof window !== 'undefined' && 'Notification' in window && Notification.permission === 'granted') {
            new Notification(title, { body, icon: '/favicon.ico' });
          }
        } catch(e) {}
      };

      const removeToast = (id) => {
        setToasts(prev => prev.filter(t => t.id !== id));
      };

      useEffect(() => {
        try {
          if (typeof window !== 'undefined' && 'Notification' in window) {
            setPushPermission(Notification.permission);

          const res = await fetch('/api/alerts/telegram/test', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bot_token: telegramToken.trim(), chat_id: telegramChatId.trim() })
          });
          const json = await res.json();
          if (json.status === 'ok') {
            setTelegramMsg({ type: 'success', text: json.message });
            triggerPushAlert('📱 Telegram Alert Sent', 'Live test push notification sent to your phone!', 'BULL');

            setTelegramMsg({ type: 'error', text: json.message });
          }
        } catch (err) {
          setTelegramMsg({ type: 'error', text: '❌ Error connecting to server: ' + err.message });
        } finally {
          setIsSendingTgTest(false);

      };

      const [accessTokenInput, setAccessTokenInput] = useState('');
      const [authTab, setAuthTab] = useState('oauth');

          if (json.client_id) setClientIdInput(json.client_id);

          console.error("Fyers status error:", err);
        }
      };

      const [fyersStatus, setFyersStatus] = useState({ is_configured: false, client_id: '', has_token: false });

      useEffect(() => {
        fetchFyersStatus();
        fetchDbDates();
        const params = new URLSearchParams(window.location.search);
        if (params.get('fyers') === 'success') {
          setAuthMsg({ type: 'success', text: '🎉 Fyers OAuth Login Successful! Live broker feed connected.' });
          setShowBrokerModal(true);
          fetchFyersStatus();
          fetchDashboardData(selectedSymbol);
          window.history.replaceState({}, document.title, window.location.pathname);
        } else if (params.get('fyers') === 'error_auth_failed') {
          setAuthMsg({ type: 'error', text: '❌ Fyers OAuth login failed. Please check your credentials.' });
          setShowBrokerModal(true);
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }, []);

      const handleOAuthSubmit = async (e) => {
        e.preventDefault();
        if (!clientIdInput) {
          setAuthMsg({ type: 'error', text: 'Please enter your Client ID.' });
          return;
        }
        setIsSubmitting(true);
        setAuthMsg(null);
        try {
          const res = await fetch('/api/fyers/credentials', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_id: clientIdInput.trim(), secret_key: secretKeyInput.trim() })
          });
          const json = await res.json();
          if (json.auth_url) {
            setAuthMsg({ type: 'success', text: 'Opening Fyers OAuth login page...' });
            fetchFyersStatus();
            setTimeout(() => {
              window.location.href = json.auth_url;
            }, 1000);
          } else {
            setAuthMsg({ type: 'error', text: json.detail || 'Failed to generate OAuth URL.' });
          }
        } catch (err) {
          setAuthMsg({ type: 'error', text: 'Server error saving credentials.' });
        } finally {
          setIsSubmitting(false);
        }
      };

      const handleTokenSubmit = async (e) => {
        e.preventDefault();
        if (!accessTokenInput) {
          setAuthMsg({ type: 'error', text: 'Please paste an Access Token.' });
          return;
        }
        setIsSubmitting(true);
        setAuthMsg(null);
        try {
          const res = await fetch('/api/fyers/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ access_token: accessTokenInput.trim() })
          });
          const json = await res.json();
          if (json.status === 'success') {
            setAuthMsg({ type: 'success', text: '✅ Fyers Access Token saved successfully!' });
            fetchFyersStatus();
            fetchDashboardData(selectedSymbol);
          } else {
            setAuthMsg({ type: 'error', text: json.detail || 'Failed to save token.' });
          }
        } catch (err) {
          setAuthMsg({ type: 'error', text: 'Error submitting token to server.' });
        } finally {
          setIsSubmitting(false);
        }
      };

      const selectedSymbolRef = useRef(selectedSymbol);
      useEffect(() => {
        selectedSymbolRef.current = selectedSymbol;
      }, [selectedSymbol]);

      // Centralized Synchronous Symbol Change Handler
      const handleSymbolChange = (targetSym) => {
        const sym = targetSym.toUpperCase();
        selectedSymbolRef.current = sym;
        setSelectedSymbol(sym);
        fetchDashboardData(sym);
        if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
          wsRef.current.send(JSON.stringify({ type: 'subscribe', symbol: sym }));
        }
      };

      // Fetch Dashboard Data via REST with Visibility Guard & Re-render Prevention (V3 Native)
      const fetchDashboardData = async (symbol) => {
        if (typeof document !== 'undefined' && document.hidden) return;
        try {
          let res = await fetch(`/api/vcc/dashboard/${symbol}`);
          let json = await res.json();
          if (json && !json.detail && !json.error && symbol.toUpperCase() === selectedSymbolRef.current.toUpperCase()) {
            json.symbol = symbol.toUpperCase();
            if (!json.vcc) {
              json.vcc = {
                answers: json.answers,
                market_state: json.market_state,
                signal_card: json.signal_card,
                structure: json.structure,
                flow: json.flow,
                system_health: json.system_health
              };

            setData(prev => {
              if (prev && prev.symbol === json.symbol && prev.timestamp === json.timestamp) {
                return prev;
              }
              return json;
            });
          }

          console.error("V3 Dashboard fetch error:", err);
        }

      useEffect(() => {

        const pollInterval = wsConnected ? 4000 : 1500;
        const interval = setInterval(() => fetchDashboardData(selectedSymbolRef.current), pollInterval);
        return () => clearInterval(interval);

      const wsRef = useRef(null);

      // Single Persistent WebSocket Connection (no disconnects on symbol tab change)
      useEffect(() => {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';

        try {
          ws = new WebSocket(wsUrl);
          wsRef.current = ws;
          ws.onopen = () => {
            setWsConnected(true);
            ws.send(JSON.stringify({ type: 'subscribe', symbol: selectedSymbolRef.current }));

            try {
              const currentSym = selectedSymbolRef.current;
              const payload = JSON.parse(event.data);
              if (payload.type === 'update') {

                  setData(prev => {
                    if (prev && prev.timestamp === payload[key].timestamp) return prev;
                    return payload[key];
                  });

                const payloadSym = payload.symbol || payload.data.symbol;

                  setData(prev => {
                    if (prev && prev.timestamp === payload.data.timestamp) return prev;
                    return payload.data;
                  });
                }
              }
            } catch(e) {}
          };
          ws.onclose = () => setWsConnected(false);
          ws.onerror = () => setWsConnected(false);

        const highPrem = raw?.high_premium ?? (openPrem * 1.05);
        const decayPts = raw?.decay_pts ?? (openPrem - combined);
        const decayPct = raw?.decay_pct ?? ((decayPts / Math.max(1, openPrem)) * 100);
        const vwap = raw?.straddle_vwap ?? (openPrem * 0.94);
        const vwapBias = raw?.vwap_bias ?? (combined <= vwap ? 'SELLER_EDGE' : 'BUYER_EXPANSION');
        const speed = raw?.decay_speed ?? (decayPct > 10 ? 'FAST DECAY' : 'STABLE');

          combined_premium: combined,

            {/* LEFT SCANNER & SECTOR PANEL (Cols 3) */}

                    { factor: 'VIX Volatility Safety', score: 9, max: 10, color: 'bg-emerald-500' },
                  ].map(f => (
                    <div key={f.factor}>
                      <div className="flex justify-between text-slate-300 mb-0.5">
                        <span>{f.factor}</span>
                        <span>{f.score}/{f.max}</span>
                      </div>
                      <div className="w-full bg-bg h-1.5 rounded overflow-hidden border border-cardBorder">
                        <div 
                          className={`h-full ${f.color}`} 
                          style={{ width: `${(f.score / f.max) * 100}%` }}
                        ></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Live Risk Triggers Log */}
              <div className="bg-card rounded border border-cardBorder p-3 shadow font-mono">
                <div className="font-bold text-slate-300 uppercase tracking-wider text-[11px] mb-2 pb-1 border-b border-cardBorder">
                  SYSTEM ALERTS & NOTIFICATIONS
                </div>
                <div className="text-[10px] text-slate-400 bg-bg p-2 rounded border border-cardBorder">
                  🟢 Market timing check active (09:00 - 15:45 IST). Automated DB vacuum active.
                </div>
              </div>

            </div>

          </div>
          </>
          )}

          {/* 3. TERMINAL FOOTER */}
          <footer className="bg-card border-t border-cardBorder px-3 py-1.5 text-[10px] font-mono text-slate-400 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <span>NSE LIVE FEED CONNECTED</span>
              <span className="hide-mobile">• REFRESH: 1s</span>
            </div>
            <div>
              ALPHA-SELL TERMINAL © 2026
            </div>
          </footer>

          {/* MOBILE BOTTOM NAV BAR (Ultra-clean phone navigation) */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-card border-t border-cardBorder flex items-center justify-around py-2 z-40 font-mono text-[10px]">
            <button 
              onClick={() => setActiveTab('smart')}
              className={`flex flex-col items-center space-y-0.5 ${activeTab === 'smart' ? 'text-bloombergOrange font-bold' : 'text-slate-400'}`}
            >
              <span>🏛️</span>
              <span>Smart</span>
            </button>
            <button 
              onClick={() => setActiveTab('heatmap')}
              className={`flex flex-col items-center space-y-0.5 ${activeTab === 'heatmap' ? 'text-bloombergOrange font-bold' : 'text-slate-400'}`}
            >
              <span>🛡️</span>
              <span>Walls</span>
            </button>
            <button 
              onClick={() => setActiveTab('chain')}
              className={`flex flex-col items-center space-y-0.5 ${activeTab === 'chain' ? 'text-bloombergOrange font-bold' : 'text-slate-400'}`}
            >
              <span>📊</span>
              <span>Chain</span>
            </button>
            <button 
              onClick={() => setActiveTab('stocks')}
              className={`flex flex-col items-center space-y-0.5 ${activeTab === 'stocks' ? 'text-bloombergOrange font-bold' : 'text-slate-400'}`}
            >
              <span>⚡</span>
              <span>Stocks</span>
            </button>
            <button 
              onClick={() => setShowBrokerModal(true)}
              className="flex flex-col items-center space-y-0.5 text-amber-300 font-bold"
            >
              <span>🔑</span>
              <span>Broker</span>
            </button>
          </nav>

          {/* 4. FYERS BROKER CONNECTION & AUTHENTICATION MODAL */}
          {showBrokerModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-3">
              <div className="bg-card border border-cardBorder rounded-lg max-w-lg w-full p-4 sm:p-5 shadow-2xl space-y-3 font-mono text-xs max-h-[90vh] overflow-y-auto">
                
                {/* Modal Header */}
                <div className="flex items-center justify-between pb-2 border-b border-cardBorder">
                  <div className="flex items-center space-x-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-bloombergOrange"></span>
                    <h2 className="font-bold text-xs sm:text-sm text-bloombergOrange tracking-wider uppercase">
                      FYERS BROKER AUTHENTICATION
                    </h2>
                  </div>
                  <button 
                    onClick={() => setShowBrokerModal(false)}
                    className="text-slate-400 hover:text-white font-bold px-2 py-0.5 rounded bg-bg border border-cardBorder cursor-pointer"
                  >
                    ✕
                  </button>
                </div>

                {/* Connection Status Box */}
                <div className="p-2.5 bg-bg rounded border border-cardBorder space-y-1.5 text-[10.5px]">
                  <div className="text-slate-400 font-bold mb-1 flex items-center justify-between">
                    <span>BROKER CONNECTION STATUS</span>
                    <span className={`text-[9.5px] px-2 py-0.5 rounded font-bold border ${
                      data?.data_source === 'FYERS_LIVE' ? 'bg-emerald-950 text-emerald-300 border-emerald-700' : 'bg-rose-950 text-rose-300 border-rose-700'
                    }`}>
                      {data?.data_source === 'FYERS_LIVE' ? 'LIVE STREAM ACTIVE' : 'FALLBACK DATA SOURCE'}
                    </span>
                  </div>
                  <div className="grid grid-cols-2 gap-1.5 text-slate-300 text-[10px]">
                    <div><span className="text-slate-500">CLIENT ID:</span> <span className="font-bold text-amber-300">{fyersStatus.client_id || 'Not Set'}</span></div>
                    <div><span className="text-slate-500">SECRET KEY:</span> <span className={fyersStatus.has_secret ? 'text-emerald-400 font-bold' : 'text-rose-400'}>{fyersStatus.has_secret ? '✓ Saved' : '✗ Missing'}</span></div>
                    <div><span className="text-slate-500">ACCESS TOKEN:</span> <span className={fyersStatus.has_token ? 'text-emerald-400 font-bold' : 'text-rose-400'}>{fyersStatus.has_token ? '✓ Active' : '✗ Expired / Not Set'}</span></div>
                    <div><span className="text-slate-500">REDIRECT URI:</span> <span className="text-blue-300 truncate">.../api/fyers/callback</span></div>
                  </div>
                  {fyersStatus.last_error && (
                    <div className="mt-2 p-1.5 rounded text-[10px] font-mono text-rose-300 bg-rose-950/60 border border-rose-800">
                      ⚠️ Broker Alert: {fyersStatus.last_error}
                    </div>
                  )}
                </div>

                {/* Alert Message Box */}
                {authMsg && (
                  <div className={`p-2 rounded text-[10.5px] font-semibold border ${
                    authMsg.type === 'success' ? 'bg-emerald-950 text-emerald-200 border-emerald-700' : 'bg-rose-950 text-rose-200 border-rose-700'
                  }`}>
                    {authMsg.text}
                  </div>
                )}

                {/* Tabs */}
                <div className="flex border-b border-cardBorder space-x-2">
                  <button
                    onClick={() => setAuthTab('oauth')}
                    className={`pb-1.5 px-2.5 font-bold text-[10.5px] transition-all border-b-2 cursor-pointer ${
                      authTab === 'oauth' ? 'border-bloombergOrange text-bloombergOrange' : 'border-transparent text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    🔑 1. OAUTH AUTO-LOGIN
                  </button>
                  <button
                    onClick={() => setAuthTab('manual')}
                    className={`pb-1.5 px-2.5 font-bold text-[10.5px] transition-all border-b-2 cursor-pointer ${
                      authTab === 'manual' ? 'border-bloombergOrange text-bloombergOrange' : 'border-transparent text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    📝 2. PASTE ACCESS TOKEN
                  </button>
                </div>

                {/* Tab 1: OAuth Auto Login */}
                {authTab === 'oauth' && (
                  <form onSubmit={handleOAuthSubmit} className="space-y-2.5 pt-1">
                    <div>
                      <label className="block text-slate-400 text-[10px] mb-1 font-bold">FYERS CLIENT ID (APP ID)</label>
                      <input
                        type="text"
                        value={clientIdInput}
                        onChange={(e) => setClientIdInput(e.target.value)}
                        placeholder="e.g. 7BRKBHOFP8-100"
                        className="w-full bg-bg border border-cardBorder rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-bloombergOrange font-mono"
                        required
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 text-[10px] mb-1 font-bold">FYERS SECRET KEY</label>
                      <input
                        type="password"
                        value={secretKeyInput}
                        onChange={(e) => setSecretKeyInput(e.target.value)}
                        placeholder="Enter Fyers App Secret Key"
                        className="w-full bg-bg border border-cardBorder rounded px-3 py-1.5 text-slate-200 focus:outline-none focus:border-bloombergOrange font-mono"
                      />
                      <p className="text-[9px] text-slate-500 mt-1">Leave blank to use saved key.</p>
                    </div>
                    
                    <div className="pt-1 flex flex-col space-y-2">
                      <button
                        type="submit"
                        disabled={isSubmitting}
                        className="w-full bg-bloombergOrange hover:bg-orange-600 text-slate-950 font-bold py-2 px-4 rounded transition-all text-xs flex items-center justify-center space-x-2 shadow cursor-pointer"
                      >
                        <span>{isSubmitting ? 'Generating Auth Link...' : '🚀 LOG IN VIA FYERS OAUTH'}</span>
                      </button>
                      <button
                        type="button"
                        onClick={() => { window.location.href = '/api/fyers/login'; }}
                        className="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-1.5 px-3 rounded border border-cardBorder text-[10.5px] cursor-pointer"
                      >
                        🌐 Direct Fyers OAuth Redirect
                      </button>
                    </div>
                  </form>
                )}

                {/* Tab 2: Manual Access Token */}
                {authTab === 'manual' && (
                  <form onSubmit={handleTokenSubmit} className="space-y-2.5 pt-1">
                    <div>
                      <label className="block text-slate-400 text-[10px] mb-1 font-bold">PASTE FYERS ACCESS TOKEN</label>
                      <textarea
                        rows={3}
                        value={accessTokenInput}
                        onChange={(e) => setAccessTokenInput(e.target.value)}
                        placeholder="Paste raw access_token here..."
                        className="w-full bg-bg border border-cardBorder rounded p-2 text-slate-200 text-[10px] focus:outline-none focus:border-bloombergOrange font-mono"
                        required
                      />
                    </div>
                    <button
                      type="submit"
                      disabled={isSubmitting}
                      className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-4 rounded transition-all text-xs flex items-center justify-center space-x-2 shadow cursor-pointer"
                    >
                      <span>{isSubmitting ? 'Saving Token...' : '💾 SAVE ACCESS TOKEN'}</span>
                    </button>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* FLOATING RADAR TOAST NOTIFICATION CONTAINER */}
          <div className="fixed top-4 right-4 z-50 flex flex-col space-y-2 max-w-xs w-full pointer-events-none font-mono">
            {toasts.map(t => (
              <div
                key={t.id}
                className={`pointer-events-auto p-3 rounded-lg border shadow-2xl backdrop-blur-md transition-all duration-300 transform translate-y-0 ${
                  t.type === 'BULL' ? 'bg-slate-950/95 border-emerald-500 text-emerald-200' :
                  t.type === 'BEAR' ? 'bg-slate-950/95 border-rose-500 text-rose-200' :
                  'bg-slate-950/95 border-bloombergOrange text-amber-200'
                }`}
              >
                <div className="flex items-center justify-between font-bold text-xs pb-1 border-b border-white/10">
                  <div className="flex items-center space-x-1.5">
                    <span className="animate-pulse">🔔</span>
                    <span>{t.title}</span>
                  </div>
                  <button onClick={() => removeToast(t.id)} className="text-slate-400 hover:text-white text-xs font-bold px-1 cursor-pointer">
                    ✕
                  </button>
                </div>
                <div className="text-[10px] text-slate-200 pt-1.5 leading-snug">
                  {t.body}
                </div>
                <div className="flex justify-between items-center text-[8.5px] text-slate-400 pt-1 mt-1 border-t border-white/5">
                  <span>INSTITUTIONAL RADAR</span>
                  <span>{t.time}</span>
                </div>
              </div>
            ))}
          </div>

          {/* TELEGRAM LOCKSCREEN PUSH ALERTS MODAL */}
          {showTelegramModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 font-mono">
              <div className="bg-card border border-cardBorder rounded-lg max-w-md w-full p-4 sm:p-5 space-y-4 shadow-2xl relative text-slate-200">
                <button
                  onClick={() => setShowTelegramModal(false)}
                  className="absolute top-3 right-3 text-slate-400 hover:text-white text-sm font-bold p-1 cursor-pointer"
                >
                  ✕
                </button>

                <div className="flex items-center space-x-2 border-b border-cardBorder pb-2">
                  <span className="text-xl">📱</span>
                  <div>
                    <h3 className="font-bold text-xs sm:text-sm text-bloombergOrange">TELEGRAM 24/7 LOCKSCREEN PUSH ALERTS</h3>
                    <p className="text-[9.5px] text-slate-400">Receive live Smart Money signals directly on your phone!</p>
                  </div>
                </div>

                {telegramMsg && (
                  <div className={`p-2 rounded text-[10px] font-bold border ${
                    telegramMsg.type === 'success' ? 'bg-emerald-950 text-emerald-300 border-emerald-700' : 'bg-rose-950 text-rose-300 border-rose-700'
                  }`}>
                    {telegramMsg.text}
                  </div>
                )}

                <div className="space-y-3 text-[10px]">
                  <div className="bg-slate-900/90 p-2.5 rounded border border-cardBorder space-y-1 text-slate-300">
                    <div className="font-bold text-emerald-400 text-[10.5px]">⚡ 1-Minute Free Setup:</div>
                    <ol className="list-decimal list-inside space-y-0.5 text-[9.5px] text-slate-300">
                      <li>Open Telegram & search <span className="text-bloombergOrange font-bold">@BotFather</span>.</li>
                      <li>Send <code className="bg-black px-1 rounded text-amber-300">/newbot</code> to get your <b>Bot Token</b>.</li>
                      <li>Search <span className="text-bloombergOrange font-bold">@userinfobot</span> to get your <b>Chat ID</b>.</li>
                    </ol>
                  </div>

                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-300 font-bold block">TELEGRAM BOT TOKEN:</label>
                    <input
                      type="text"
                      value={telegramToken}
                      onChange={(e) => setTelegramToken(e.target.value)}
                      placeholder="e.g. 123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ"
                      className="w-full bg-bg border border-cardBorder rounded p-2 text-[10px] text-slate-200 focus:border-bloombergOrange outline-none font-mono"
                    />
                  </div>

                  <div className="space-y-1">
                    <label className="text-[10px] text-slate-300 font-bold block">TELEGRAM CHAT ID:</label>
                    <input
                      type="text"
                      value={telegramChatId}
                      onChange={(e) => setTelegramChatId(e.target.value)}
                      placeholder="e.g. 987654321"
                      className="w-full bg-bg border border-cardBorder rounded p-2 text-[10px] text-slate-200 focus:border-bloombergOrange outline-none font-mono"
                    />
                  </div>

                  <button
                    onClick={handleTestTelegramAlert}
                    disabled={isSendingTgTest}
                    className="w-full bg-bloombergOrange hover:bg-orange-600 text-black font-bold py-2 rounded transition text-[11px] shadow cursor-pointer disabled:opacity-50"
                  >
                    {isSendingTgTest ? '🔄 SENDING TEST PUSH ALERT...' : '⚡ TEST TELEGRAM PUSH ALERT ON PHONE'}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 📱 MOBILE BOTTOM NAVIGATION BAR (Fixed at bottom on smartphones) */}
          <nav className="block md:hidden fixed bottom-0 left-0 right-0 z-50 bg-slate-950/95 border-t border-cardBorder/80 backdrop-blur-md px-1.5 py-1 shadow-2xl">
            <div className="flex items-center justify-around text-center">
              <button
                onClick={() => {
                  setViewMode('TERMINAL');
                  setActiveTab('terminal');
                }}
                className={`flex flex-col items-center justify-center text-[9px] font-mono font-bold transition-all py-1 px-1.5 rounded cursor-pointer ${
                  viewMode === 'TERMINAL' ? 'text-bloombergOrange bg-slate-900 border border-bloombergOrange/40' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className="text-sm">📊</span>
                <span>TERMINAL</span>
              </button>

              <button
                onClick={() => {
                  setViewMode('VISUAL');
                }}
                className={`flex flex-col items-center justify-center text-[9px] font-mono font-bold transition-all py-1 px-1.5 rounded cursor-pointer ${
                  viewMode === 'VISUAL' ? 'text-emerald-400 bg-emerald-950/80 border border-emerald-600 shadow-[0_0_8px_rgba(16,185,129,0.4)]' : 'text-emerald-400/70 hover:text-emerald-300'
                }`}
              >
                <span className="text-sm">🎨</span>
                <span>VISUAL</span>
              </button>

              <button
                onClick={() => {
                  setViewMode('TERMINAL');
                  setActiveTab('smart');
                }}
                className={`flex flex-col items-center justify-center text-[9px] font-mono font-bold transition-all py-1 px-1.5 rounded cursor-pointer ${
                  viewMode === 'TERMINAL' && activeTab === 'smart' ? 'text-bloombergOrange bg-slate-900 border border-bloombergOrange/40' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className="text-sm">🏛️</span>
                <span>SMART</span>
              </button>

              <button
                onClick={() => {
                  setViewMode('TERMINAL');
                  setActiveTab('stocks');
                }}
                className={`flex flex-col items-center justify-center text-[9px] font-mono font-bold transition-all py-1 px-1.5 rounded cursor-pointer ${
                  viewMode === 'TERMINAL' && activeTab === 'stocks' ? 'text-bloombergOrange bg-slate-900 border border-bloombergOrange/40' : 'text-slate-400 hover:text-slate-200'
                }`}
              >
                <span className="text-sm">📑</span>
                <span>STOCKS</span>
              </button>

              <button
                onClick={() => setShowToolsModal(true)}
                className="flex flex-col items-center justify-center text-[9px] font-mono font-bold transition-all py-1 px-1.5 rounded text-amber-400 hover:text-amber-300 cursor-pointer"
              >
                <span className="text-sm">⚙️</span>
                <span>TOOLS</span>
              </button>
            </div>
          </nav>

          {/* ⚙️ MOBILE QUICK TOOLS MODAL */}
          {showToolsModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-card border border-cardBorder rounded-lg max-w-sm w-full p-4 space-y-3 font-mono text-xs shadow-2xl">
                <div className="flex items-center justify-between border-b border-cardBorder pb-2">
                  <span className="font-bold text-slate-100 text-sm flex items-center space-x-1.5">
                    <span>⚙️</span>
                    <span>QUICK TERMINAL TOOLS</span>
                  </span>
                  <button
                    onClick={() => setShowToolsModal(false)}
                    className="text-slate-400 hover:text-white font-bold px-2 py-0.5 rounded bg-bg border border-cardBorder cursor-pointer text-sm"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-2">
                  {/* Force Refresh */}
                  <button
                    onClick={() => {
                      fetchDashboardData(selectedSymbol);
                      setShowToolsModal(false);
                    }}
                    className="w-full p-2.5 rounded bg-slate-800 hover:bg-slate-700 text-slate-200 border border-cardBorder flex items-center justify-between font-bold cursor-pointer"
                  >
                    <span>⚡ Force Refresh Live Data</span>
                    <span className="text-[10px] text-amber-400">INSTANT</span>
                  </button>

                  {/* Fyers Broker Login */}
                  <button
                    onClick={() => {
                      fetchFyersStatus();
                      setShowToolsModal(false);
                      setShowBrokerModal(true);
                    }}
                    className={`w-full p-2.5 rounded border flex items-center justify-between font-bold cursor-pointer ${
                      fyersStatus.is_configured && data?.data_source === 'FYERS_LIVE'
                        ? 'bg-emerald-950/80 text-emerald-300 border-emerald-600'
                        : 'bg-amber-950/90 text-amber-300 border-amber-600'
                    }`}
                  >
                    <span>🔑 Fyers Broker Integration</span>
                    <span className="text-[10px] uppercase">{data?.data_source === 'FYERS_LIVE' ? 'CONNECTED' : 'LOGIN'}</span>
                  </button>

                  {/* Telegram Push Alerts */}
                  <button
                    onClick={() => {
                      setShowToolsModal(false);
                      setShowTelegramModal(true);
                    }}
                    className={`w-full p-2.5 rounded border flex items-center justify-between font-bold cursor-pointer ${
                      telegramToken && telegramChatId
                        ? 'bg-blue-950/90 text-sky-300 border-sky-600'
                        : 'bg-indigo-950 text-indigo-300 border-indigo-600'
                    }`}
                  >
                    <span>📱 Telegram Lockscreen Push</span>
                    <span className="text-[10px] uppercase">{telegramToken && telegramChatId ? 'ACTIVE' : 'SETUP'}</span>
                  </button>

                  {/* Sound Audio Chime */}
                  <button
                    onClick={() => {
                      const next = !soundEnabled;
                      setSoundEnabled(next);
                      if (next) playChime('BULL');
                    }}
                    className={`w-full p-2.5 rounded border flex items-center justify-between font-bold cursor-pointer ${
                      soundEnabled ? 'bg-emerald-950 text-emerald-300 border-emerald-700' : 'bg-slate-900 text-slate-500 border-cardBorder'
                    }`}
                  >
                    <span>🔊 Sound Chime Audio Alerts</span>
                    <span className="text-[10px] uppercase">{soundEnabled ? 'ENABLED' : 'MUTED'}</span>
                  </button>

                  {/* Web Browser Notifications */}
                  <button
                    onClick={() => {
                      requestNotificationPermission();
                      setShowToolsModal(false);
                    }}
                    className={`w-full p-2.5 rounded border flex items-center justify-between font-bold cursor-pointer ${
                      pushPermission === 'granted'
                        ? 'bg-blue-950/80 text-blue-300 border-blue-600'
                        : 'bg-slate-800 text-amber-300 border-amber-500/60'
                    }`}
                  >
                    <span>🔔 Browser Desktop Notifications</span>
                    <span className="text-[10px] uppercase">{pushPermission === 'granted' ? 'GRANTED' : 'ENABLE'}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

              </div>
            )}
          </div>
        </div>
      );
    }



    // Render App wrapped in ErrorBoundary
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <OptionsTerminalApp />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
